            ('20261022-161217.png','f693450be22abb6a5e2a589fa88700f1758ce2b17232d715f3a2d57325e0b46c','https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-7f88-820c-9e0a-39883b3032b1/raw?se=2026-10-22T20%3A47%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=6090fcdd-97df-5e48-8bf5-0cc35b653684&skoid=434ec24f-a0f0-4e64-b0de-2e2053f69735&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T18%3A42%3A23Z&ske=2026-10-23T18%3A42%3A23Z&sks=b&skv=2026-02-06&sig=4fiLpMXfL8YMkwy26uu%2BgzjQ63oISVM9wjHT5p4C/5o%3D')
          ]
          def load(item):
              name, expected, url = item
              data = urlopen(url, timeout=30).read(1000000)
              assert data.startswith(b'\x89PNG\r\n\x1a\n') and hashlib.sha256(data).hexdigest() == expected, name
              (target / name).write_bytes(data)
              print(name, 'verified')
          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(load, assets))
          cropped = base64.b64decode('')
          assert hashlib.sha256(cropped).hexdigest() == '8d41fd908e7ce72f9aa973120fd28dcc16e777c594454c32adf9447648bf2bbe'
          (target / 'driver-options.webp').write_bytes(cropped)
      - name: Commit only the approved image assets to the existing PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/assets/week-10/screenshots
          git diff --cached --quiet || git commit -m 'Add instructor screenshots for Week 10 setup and CRUD'
          git push origin HEAD:update/week10-compass-driver-syntax-pandas
