          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/assets/week-10/screenshots
          git rm -- .github/workflows/one-time-pr56-assets.yml
          git commit -m 'Add query and Colab screenshots; finish one-time asset transfer'
          git push origin HEAD:update/week10-compass-driver-syntax-pandas
