            ('20261022-160802.png','b886a200ee70e286aefc4a628c0f3a734beb143737dc7e3046cd9a2670fc2754','https://sdmntprnortheu.oaiusercontent.com/files/00000000-14f0-81f4-aeef-43a1c8435f4d/raw?se=2026-10-22T20%3A46%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=f3f8484b-61e0-5247-8e92-019a581236e4&skoid=434ec24f-a0f0-4e64-b0de-2e2053f69735&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T15%3A02%3A58Z&ske=2026-10-23T15%3A02%3A58Z&sks=b&skv=2026-02-06&sig=/GRBgd/cacVRrqfO0f7fVfnOZORTKbm1G7wPVIKOeDg%3D'),
