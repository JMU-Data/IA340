name: One-time PR56 screenshot transfer
on:
  push:
    branches: [update/week10-compass-driver-syntax-pandas]
    paths: [.github/workflows/one-time-pr56-assets.yml]
permissions:
  contents: write
jobs:
  import-assets:
    if: github.repository == 'JMU-Data/IA340'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/week10-compass-driver-syntax-pandas
      - name: Copy instructor-approved images with integrity checks
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          from concurrent.futures import ThreadPoolExecutor
          import hashlib, base64
          target = Path('docs/assets/week-10/screenshots')
          target.mkdir(parents=True, exist_ok=True)
          assets = [
            ('20261022-160446.png','9de0f1b6c82ec5698c84c67e0e2953050479f9779737e131cb451afba87dad15','https://sdmntprnortheu.oaiusercontent.com/files/00000000-fc64-81f4-a04b-c46d23667acd/raw?se=2026-10-22T20%3A46%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=6987fe4c-eed2-58e6-ae28-10e77938c884&skoid=434ec24f-a0f0-4e64-b0de-2e2053f69735&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T15%3A02%3A58Z&ske=2026-10-23T15%3A02%3A58Z&sks=b&skv=2026-02-06&sig=eEws58UTSil2%2BojMQVv2Eqbj65aPZsQYbHicWiH%2BXu4%3D'),
