<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">One-to-one one-to-many and many-to-many relationships</title><desc id="desc">A student has zero or one login account in this model; an account refers to exactly one student. A locality has zero or many population observations. Enrollment resolves students-to-courses many-to-many with two one-to-many links.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="44" font-size="32" fill="#172b4d" font-weight="bold" text-anchor="start">Three relationship patterns</text><text x="40" y="113" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">ONE TO ONE</text><rect x="280" y="76" width="250" height="95" rx="10" fill="white" stroke="#ccd7e2"/><text x="405.0" y="112" font-size="23" fill="#0969da" font-weight="bold" text-anchor="middle">Student</text><text x="405.0" y="144" font-size="17" fill="#57606a" font-weight="normal" text-anchor="middle">student_id · PK</text><rect x="850" y="76" width="310" height="95" rx="10" fill="white" stroke="#ccd7e2"/><text x="1005.0" y="112" font-size="23" fill="#0969da" font-weight="bold" text-anchor="middle">Login account</text><text x="1005.0" y="144" font-size="17" fill="#57606a" font-weight="normal" text-anchor="middle">student_id · FK + UNIQUE</text><line x1="530" y1="124" x2="850" y2="124" stroke="#16816a" stroke-width="3"/><line x1="550" y1="112" x2="550" y2="136" stroke="#16816a" stroke-width="3"/><line x1="562" y1="112" x2="562" y2="136" stroke="#16816a" stroke-width="3"/><line x1="829" y1="112" x2="829" y2="136" stroke="#16816a" stroke-width="3"/><circle cx="813" cy="124" r="6" fill="white" stroke="#16816a" stroke-width="3"/><text x="630" y="111" font-size="18" fill="#16816a" font-weight="bold" text-anchor="start">1 to 0..1</text><text x="280" y="201" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">Each account has one student; each student has at most one account.</text><text x="40" y="314" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">ONE TO MANY</text><rect x="280" y="274" width="250" height="95" rx="10" fill="white" stroke="#ccd7e2"/><text x="405.0" y="310" font-size="23" fill="#0969da" font-weight="bold" text-anchor="middle">Locality</text><text x="405.0" y="342" font-size="17" fill="#57606a" font-weight="normal" text-anchor="middle">fips · PK</text><rect x="850" y="274" width="310" height="95" rx="10" fill="white" stroke="#ccd7e2"/><text x="1005.0" y="310" font-size="23" fill="#0969da" font-weight="bold" text-anchor="middle">Population rows</text><text x="1005.0" y="342" font-size="17" fill="#57606a" font-weight="normal" text-anchor="middle">fips · FK; PK (fips, year)</text><line x1="530" y1="321" x2="850" y2="321" stroke="#16816a" stroke-width="3"/><line x1="550" y1="309" x2="550" y2="333" stroke="#16816a" stroke-width="3"/><line x1="562" y1="309" x2="562" y2="333" stroke="#16816a" stroke-width="3"/><circle cx="815" cy="321" r="6" fill="white" stroke="#16816a" stroke-width="3"/><path d="M850 309L831 321L850 333" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="623" y="306" font-size="18" fill="#16816a" font-weight="bold" text-anchor="start">1 to 0..N</text><text x="280" y="400" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">One locality can have observations for multiple years.</text><text x="40" y="511" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">MANY TO MANY</text><rect x="280" y="472" width="200" height="95" rx="10" fill="white" stroke="#ccd7e2"/><text x="380.0" y="508" font-size="23" fill="#0969da" font-weight="bold" text-anchor="middle">Students</text><text x="380.0" y="540" font-size="17" fill="#57606a" font-weight="normal" text-anchor="middle">student_id · PK</text><rect x="610" y="472" width="270" height="95" rx="10" fill="white" stroke="#ccd7e2"/><text x="745.0" y="508" font-size="23" fill="#0969da" font-weight="bold" text-anchor="middle">Enrollments</text><text x="745.0" y="540" font-size="17" fill="#57606a" font-weight="normal" text-anchor="middle">student_id + course_id · PK</text><rect x="1010" y="472" width="160" height="95" rx="10" fill="white" stroke="#ccd7e2"/><text x="1090.0" y="508" font-size="23" fill="#0969da" font-weight="bold" text-anchor="middle">Courses</text><text x="1090.0" y="540" font-size="17" fill="#57606a" font-weight="normal" text-anchor="middle">course_id · PK</text><line x1="480" y1="520" x2="610" y2="520" stroke="#16816a" stroke-width="3"/><line x1="880" y1="520" x2="1010" y2="520" stroke="#16816a" stroke-width="3"/><line x1="495" y1="508" x2="495" y2="532" stroke="#16816a" stroke-width="3"/><line x1="505" y1="508" x2="505" y2="532" stroke="#16816a" stroke-width="3"/><line x1="985" y1="508" x2="985" y2="532" stroke="#16816a" stroke-width="3"/><line x1="995" y1="508" x2="995" y2="532" stroke="#16816a" stroke-width="3"/><circle cx="578" cy="520" r="5" fill="white" stroke="#16816a" stroke-width="3"/><path d="M610 508L592 520L610 532" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="912" cy="520" r="5" fill="white" stroke="#16816a" stroke-width="3"/><path d="M880 508L898 520L880 532" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="600" font-size="21" fill="#172b4d" font-weight="normal" text-anchor="start">The junction table records each student–course pair as two foreign keys.</text><text x="40" y="672" font-size="20" fill="#57606a" font-weight="normal" text-anchor="start">circle = zero allowed     | = one     crow’s foot = many     •     Read both ends of a relationship.</text></g></svg>