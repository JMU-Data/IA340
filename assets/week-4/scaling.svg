<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Vertical and horizontal scaling illustrated with servers</title><desc id="desc">Vertical scaling adds resources to one server, depicted as a bigger tower. Horizontal scaling distributes work across multiple servers. Both have resource and operational costs.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker></defs><rect width="1200" height="740" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="875" y="153" text-anchor="middle" fill="#57606a" font-size="17">Before: one node</text><text x="1070" y="380" text-anchor="middle" fill="#57606a" font-size="17">After: three nodes</text><text x="40" y="44" font-size="34" fill="#172b4d" font-weight="bold" text-anchor="start">Scale up or scale out?</text><text x="305" y="110" font-size="26" fill="#0969da" font-weight="bold" text-anchor="middle">VERTICAL — a bigger server</text><text x="895" y="110" font-size="26" fill="#16816a" font-weight="bold" text-anchor="middle">HORIZONTAL — more servers</text><rect x="90" y="291" width="120" height="160" rx="12" fill="#e6eef6" stroke="#345778"/><rect x="104" y="311.0" width="92" height="31.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="182" cy="323.0" r="4" fill="#16816a"/><line x1="117" y1="323.0" x2="167" y2="323.0" stroke="#345778" stroke-width="4"/><rect x="104" y="351.0" width="92" height="31.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="182" cy="363.0" r="4" fill="#16816a"/><line x1="117" y1="363.0" x2="167" y2="363.0" stroke="#345778" stroke-width="4"/><rect x="104" y="391.0" width="92" height="31.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="182" cy="403.0" r="4" fill="#16816a"/><line x1="117" y1="403.0" x2="167" y2="403.0" stroke="#345778" stroke-width="4"/><line x1="224" y1="351" x2="332" y2="351" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="190" width="175" height="260" rx="12" fill="#e6eef6" stroke="#345778"/><rect x="379" y="210.0" width="147" height="35.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="512" cy="222.0" r="4" fill="#16816a"/><line x1="392" y1="222.0" x2="443" y2="222.0" stroke="#345778" stroke-width="4"/><rect x="379" y="254.0" width="147" height="35.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="512" cy="266.0" r="4" fill="#16816a"/><line x1="392" y1="266.0" x2="443" y2="266.0" stroke="#345778" stroke-width="4"/><rect x="379" y="298.0" width="147" height="35.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="512" cy="310.0" r="4" fill="#16816a"/><line x1="392" y1="310.0" x2="443" y2="310.0" stroke="#345778" stroke-width="4"/><rect x="379" y="342.0" width="147" height="35.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="512" cy="354.0" r="4" fill="#16816a"/><line x1="392" y1="354.0" x2="443" y2="354.0" stroke="#345778" stroke-width="4"/><rect x="379" y="386.0" width="147" height="35.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="512" cy="398.0" r="4" fill="#16816a"/><line x1="392" y1="398.0" x2="443" y2="398.0" stroke="#345778" stroke-width="4"/><text x="151" y="485" font-size="19" fill="#57606a" font-weight="normal" text-anchor="middle">2 CPUs / 8 GB</text><text x="452" y="485" font-size="19" fill="#57606a" font-weight="normal" text-anchor="middle">8 CPUs / 32 GB</text><text x="301" y="525" font-size="16" fill="#57606a" font-weight="normal" text-anchor="middle">Illustrative capacity, not a price quote</text><rect x="806" y="169" width="140" height="160" rx="12" fill="#e6eef6" stroke="#345778"/><rect x="820" y="189.0" width="112" height="31.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="918" cy="201.0" r="4" fill="#16816a"/><line x1="833" y1="201.0" x2="884" y2="201.0" stroke="#345778" stroke-width="4"/><rect x="820" y="229.0" width="112" height="31.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="918" cy="241.0" r="4" fill="#16816a"/><line x1="833" y1="241.0" x2="884" y2="241.0" stroke="#345778" stroke-width="4"/><rect x="820" y="269.0" width="112" height="31.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="918" cy="281.0" r="4" fill="#16816a"/><line x1="833" y1="281.0" x2="884" y2="281.0" stroke="#345778" stroke-width="4"/><path d="M 875 337 V 370 H 687 V 398 M 875 370 V 398 M875 370 H1063 V398" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="627" y="398" width="120" height="142" rx="12" fill="#e6eef6" stroke="#345778"/><rect x="641" y="418.0" width="92" height="25.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="719" cy="430.0" r="4" fill="#16816a"/><line x1="654" y1="430.0" x2="704" y2="430.0" stroke="#345778" stroke-width="4"/><rect x="641" y="452.0" width="92" height="25.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="719" cy="464.0" r="4" fill="#16816a"/><line x1="654" y1="464.0" x2="704" y2="464.0" stroke="#345778" stroke-width="4"/><rect x="641" y="486.0" width="92" height="25.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="719" cy="498.0" r="4" fill="#16816a"/><line x1="654" y1="498.0" x2="704" y2="498.0" stroke="#345778" stroke-width="4"/><rect x="815" y="398" width="120" height="142" rx="12" fill="#e6eef6" stroke="#345778"/><rect x="829" y="418.0" width="92" height="25.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="907" cy="430.0" r="4" fill="#16816a"/><line x1="842" y1="430.0" x2="892" y2="430.0" stroke="#345778" stroke-width="4"/><rect x="829" y="452.0" width="92" height="25.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="907" cy="464.0" r="4" fill="#16816a"/><line x1="842" y1="464.0" x2="892" y2="464.0" stroke="#345778" stroke-width="4"/><rect x="829" y="486.0" width="92" height="25.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="907" cy="498.0" r="4" fill="#16816a"/><line x1="842" y1="498.0" x2="892" y2="498.0" stroke="#345778" stroke-width="4"/><rect x="1003" y="398" width="120" height="142" rx="12" fill="#e6eef6" stroke="#345778"/><rect x="1017" y="418.0" width="92" height="25.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="1095" cy="430.0" r="4" fill="#16816a"/><line x1="1030" y1="430.0" x2="1080" y2="430.0" stroke="#345778" stroke-width="4"/><rect x="1017" y="452.0" width="92" height="25.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="1095" cy="464.0" r="4" fill="#16816a"/><line x1="1030" y1="464.0" x2="1080" y2="464.0" stroke="#345778" stroke-width="4"/><rect x="1017" y="486.0" width="92" height="25.0" rx="4" fill="white" stroke="#8da5bc"/><circle cx="1095" cy="498.0" r="4" fill="#16816a"/><line x1="1030" y1="498.0" x2="1080" y2="498.0" stroke="#345778" stroke-width="4"/><text x="897" y="570" font-size="20" fill="#16816a" font-weight="bold" text-anchor="middle">Distribute requests or partition data</text><line x1="595" y1="95" x2="595" y2="646" stroke="#ccd7e2" stroke-width="2"/><text x="40" y="597" font-size="22" fill="#0969da" font-weight="bold" text-anchor="start">More CPU/RAM raises the instance rate.</text><text x="40" y="632" font-size="19" fill="#57606a" font-weight="normal" text-anchor="start">Simple design; one-machine capacity ceiling.</text><text x="635" y="610" font-size="22" fill="#16816a" font-weight="bold" text-anchor="start">More nodes also cost money.</text><text x="635" y="645" font-size="19" fill="#57606a" font-weight="normal" text-anchor="start">Routing and coordination are required.</text><text x="600" y="700" font-size="22" fill="#172b4d" font-weight="bold" text-anchor="middle">Neither approach is always cheaper. Match the design to the workload.</text></g></svg>