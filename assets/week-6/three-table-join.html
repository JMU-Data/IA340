<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join three tables in two steps</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1f2328;background:white}h2{font-size:22px;margin:0 0 10px}h3{font-size:17px;margin:8px 0}button{font:inherit;padding:7px 13px;margin:0 6px 8px 0;border:1px solid #8c959f;background:#f6f8fa;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #0969da}table{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}td,th{border:1px solid #d0d7de;padding:6px 9px;text-align:left}th{background:#f6f8fa}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.hit{background:#ddf4ff}.missing{background:#fff1e5}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;font:15px/1.4 ui-monospace,Consolas,monospace}.note{font-size:14px;color:#57606a}#status{padding:8px 12px;background:#ddf4ff;min-height:40px;border-radius:6px}tr{transition:background-color .25s}@media(max-width:650px){.grid,.three{grid-template-columns:1fr}body{font-size:16px;padding:8px}table{font-size:14px}}</style></head><body><h2>Two matches make one area-year row</h2><div class="grid three"><div><h3>name AS n</h3><div id="n"></div></div><div><h3>population AS p</h3><div id="p"></div></div><div><h3>income AS i</h3><div id="i"></div></div></div><button id="next">Next step</button><button id="reset">Reset</button><p id="status" aria-live="polite"></p><div id="out"></div><pre id="sql"></pre><p class="note">Selected 2023–2024 rows from the instructor's CSV exports. A JOIN does not create a stored table.</p><script>function table(h,rows){return '<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+(x===null?'NULL':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
const ns=[['51059','Fairfax County'],['51107','Loudoun County']], ps=[['51059',2023,1141878],['51059',2024,1160925],['51107',2023,436347],['51107',2024,443380]],is=[['51059',2023,141553],['51059',2024,154545],['51107',2023,174148],['51107',2024,177567]];
let step=0;document.getElementById('n').innerHTML=table(['fips','name'],ns);document.getElementById('p').innerHTML=table(['fips','year','population'],ps);document.getElementById('i').innerHTML=table(['fips','year','income'],is);
function draw(){let rows=ps.map(p=>[p[0],ns.find(n=>n[0]===p[0])[1],p[1],p[2]]);document.getElementById('out').innerHTML=step===0?'':table(step===1?['fips','name','year','population']:['fips','name','year','population','income'],step===1?rows:rows.map(r=>[...r,is.find(i=>i[0]===r[0]&&i[1]===r[2])[2]]));document.getElementById('status').textContent=['Start with names and the two measurement tables.','Step 1: n.fips = p.fips attaches a name to every population row.','Step 2: p.fips = i.fips AND p.year = i.year attaches the SAME year\'s income.'][step];document.getElementById('sql').textContent=step===0?'':step===1?'FROM public.name AS n\nJOIN public.population AS p ON n.fips = p.fips':'FROM public.name AS n\nJOIN public.population AS p ON n.fips = p.fips\nJOIN public.income AS i\n  ON p.fips = i.fips AND p.year = i.year';document.getElementById('next').disabled=step===2;}
document.getElementById('next').onclick=()=>{step++;draw();};document.getElementById('reset').onclick=()=>{step=0;draw();};draw();function report(){if(parent!==window)parent.postMessage({type:'ia340-height',height:document.body.scrollHeight+8},'*');}addEventListener('load',report);new ResizeObserver(report).observe(document.body);</script></body></html>
