<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="485" viewBox="0 0 1280 485" role="img" aria-labelledby="title desc"><title id="title">One source. Two clients. One course database.</title><desc id="desc">Both Colab and Studio can read and write. Monday and Wednesday use different workflows.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0969da"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1278" height="483" rx="12" fill="white" stroke="#d0d7de"/><text x="28" y="43" font-size="30" fill="#1f2328" font-weight="700">One source. Two clients. One course database.</text><text x="28" y="78" font-size="18" fill="#57606a" font-weight="400">Both Colab and Studio can read and write. Monday and Wednesday use different workflows.</text><rect x="22" y="112" width="310" height="277" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="39" y="146" font-size="23" fill="#1f2328" font-weight="700">Census Bureau</text><text x="39" y="173" font-size="17" fill="#57606a" font-weight="400">Source data services</text><path d="M38 229 C38 205,170 205,170 229 L170 320 C170 344,38 344,38 320 Z" fill="white" stroke="#0969da" stroke-width="2"/><ellipse cx="104.0" cy="229" rx="66.0" ry="17" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="56" y="272" font-size="21" fill="#1f2328" font-weight="700">ACS 1-year</text><text x="52" y="302" font-size="17" fill="#1f2328" font-weight="400">2015–24</text><rect x="215" y="226" width="98" height="96" rx="10" fill="white" stroke="#d0d7de"/><text x="230" y="262" font-size="20" fill="#1f2328" font-weight="700">Data</text><text x="239" y="289" font-size="20" fill="#1f2328" font-weight="700">API</text><path d="M175 276 L210 276" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><rect x="416" y="199" width="211" height="150" rx="10" fill="#ddf4ff" stroke="#0969da"/><text x="440" y="236" font-size="24" fill="#1f2328" font-weight="700">Google Colab</text><text x="438" y="267" font-size="19" fill="#1f2328" font-weight="400">Python + census</text><text x="438" y="299" font-size="19" fill="#1f2328" font-weight="400">SELECT + INSERT</text><text x="438" y="329" font-size="17" fill="#1f2328" font-weight="400">connection / cursor</text><path d="M410 222 L339 222" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><text x="341" y="208" font-size="15" fill="#0969da" font-weight="400">request</text><path d="M339 316 L408 316" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><text x="342" y="340" font-size="15" fill="#0969da" font-weight="400">JSON data</text><rect x="751" y="112" width="507" height="277" rx="10" fill="#f0f7ff" stroke="#0969da"/><text x="772" y="148" font-size="23" fill="#1f2328" font-weight="700">Your Google Cloud project</text><path d="M775 228 C775 204,982 204,982 228 L982 324 C982 348,775 348,775 324 Z" fill="white" stroke="#0969da" stroke-width="2"/><ellipse cx="878.5" cy="228" rx="103.5" ry="17" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="797" y="266" font-size="22" fill="#1f2328" font-weight="700">Cloud SQL</text><text x="796" y="297" font-size="20" fill="#1f2328" font-weight="400">PostgreSQL</text><text x="795" y="322" font-size="17" fill="#1f2328" font-weight="400">3 existing tables</text><rect x="1100" y="212" width="140" height="130" rx="10" fill="white" stroke="#d0d7de"/><text x="1117" y="246" font-size="19" fill="#1f2328" font-weight="700">Cloud SQL</text><text x="1128" y="274" font-size="22" fill="#1f2328" font-weight="700">Studio</text><text x="1118" y="305" font-size="18" fill="#1f2328" font-weight="400">SQL editor</text><text x="1114" y="328" font-size="17" fill="#1f2328" font-weight="400">read + write</text><path d="M637 245 L742 245" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><text x="655" y="229" font-size="17" fill="#0969da" font-weight="400">SQL</text><path d="M742 304 L637 304" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><text x="650" y="328" font-size="17" fill="#0969da" font-weight="400">results</text><path d="M1093 246 L991 246" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><text x="1020" y="229" font-size="17" fill="#0969da" font-weight="400">SQL</text><path d="M991 305 L1093 305" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><text x="1009" y="330" font-size="17" fill="#0969da" font-weight="400">results</text><text x="28" y="425" font-size="21" fill="#1f2328" font-weight="700">Monday: collect via the API, then INSERT.     Wednesday: SELECT and aggregate in Studio.</text><text x="28" y="458" font-size="17" fill="#57606a" font-weight="400">County names: Census directory. Measurements: annual ACS. Conceptual map—not Census infrastructure.</text></svg>