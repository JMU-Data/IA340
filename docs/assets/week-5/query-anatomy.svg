<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Build one SQL sentence, one clause at a time</title><desc id="desc">Wednesday: type SQL directly in Cloud SQL Studio. No Python wrapper.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker></defs>
<rect x="1" y="1" width="1198" height="638" rx="18" fill="white" stroke="#d0d7de"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2328}.mono{font-family:Consolas,monospace}</style>

<text x="40" y="85" font-size="32" style="fill:#1f2328" font-weight="700">Build one SQL sentence, one clause at a time</text>
<text x="40" y="118" font-size="18" style="fill:#57606a" font-weight="400">Wednesday: type SQL directly in Cloud SQL Studio. No Python wrapper.</text>
<rect x="40" y="167" width="700" height="63" rx="10" fill="#ddf4ff" stroke="#d0d7de"/>
<text x="60" y="207" font-size="26" style="fill:#1f2328" font-weight="500" class="mono">SELECT fips, population</text>
<polyline points="755,199 803,199" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>
<text x="830" y="206" font-size="26" style="fill:#0969da" font-weight="700">Which columns?</text>
<rect x="40" y="244" width="700" height="63" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="60" y="284" font-size="26" style="fill:#1f2328" font-weight="500" class="mono">FROM public.population</text>
<polyline points="755,276 803,276" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>
<text x="830" y="283" font-size="26" style="fill:#0969da" font-weight="700">Which table?</text>
<rect x="40" y="321" width="700" height="63" rx="10" fill="#ddf4ff" stroke="#d0d7de"/>
<text x="60" y="361" font-size="26" style="fill:#1f2328" font-weight="500" class="mono">WHERE year = 2024</text>
<polyline points="755,353 803,353" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>
<text x="830" y="360" font-size="26" style="fill:#0969da" font-weight="700">Which rows?</text>
<rect x="40" y="398" width="700" height="63" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="60" y="438" font-size="26" style="fill:#1f2328" font-weight="500" class="mono">ORDER BY population DESC, fips</text>
<polyline points="755,430 803,430" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>
<text x="830" y="437" font-size="26" style="fill:#0969da" font-weight="700">What order?</text>
<rect x="40" y="475" width="700" height="63" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="60" y="515" font-size="26" style="fill:#1f2328" font-weight="500" class="mono">LIMIT 5;</text>
<polyline points="755,507 803,507" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>
<text x="830" y="514" font-size="26" style="fill:#0969da" font-weight="700">How many rows?</text>
<text x="40" y="612" font-size="16" style="fill:#57606a" font-weight="400">This is SQL writing order. PostgreSQL may use different internal execution plans.</text>
</svg>