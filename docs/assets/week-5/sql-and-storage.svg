<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">Connection owns the session. Cursor sends the SQL.</title><desc id="desc">Two Python objects, one database session. PostgreSQL—not the notebook—executes SQL.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0969da"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1278" height="438" rx="12" fill="white" stroke="#d0d7de"/><text x="28" y="43" font-size="30" fill="#1f2328" font-weight="700">Connection owns the session. Cursor sends the SQL.</text><text x="28" y="78" font-size="18" fill="#57606a" font-weight="400">Two Python objects, one database session. PostgreSQL—not the notebook—executes SQL.</text><rect x="28" y="119" width="765" height="222" rx="10" fill="#f0f7ff" stroke="#0969da"/><text x="50" y="156" font-size="24" fill="#1f2328" font-weight="700">conn = psycopg2.connect(...)</text><text x="50" y="193" font-size="21" fill="#1f2328" font-weight="400">Connection object: login, database session, transaction</text><rect x="58" y="215" width="375" height="98" rx="10" fill="white" stroke="#d0d7de"/><text x="76" y="249" font-size="23" fill="#1f2328" font-weight="700">cur = conn.cursor()</text><text x="76" y="285" font-size="24" fill="#0969da" font-weight="700">cur.execute(sql)</text><text x="470" y="251" font-size="26" fill="#1a7f37" font-weight="700">conn.commit()</text><text x="470" y="286" font-size="20" fill="#1f2328" font-weight="400">Finalize the transaction</text><path d="M948 181 C948 157,1203 157,1203 181 L1203 295 C1203 319,948 319,948 295 Z" fill="white" stroke="#0969da" stroke-width="2"/><ellipse cx="1075.5" cy="181" rx="127.5" ry="17" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="982" y="229" font-size="26" fill="#1f2328" font-weight="700">PostgreSQL</text><text x="980" y="263" font-size="20" fill="#1f2328" font-weight="400">name / population</text><text x="980" y="291" font-size="20" fill="#1f2328" font-weight="400">income</text><path d="M800 232 L938 232" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><text x="828" y="215" font-size="19" fill="#0969da" font-weight="400">SQL</text><text x="817" y="268" font-size="16" fill="#1f2328" font-weight="400">through conn</text><text x="28" y="381" font-size="22" fill="#1f2328" font-weight="700">cur.execute(sql): perform the statement.     conn.commit(): keep this transaction’s changes.</text><text x="28" y="416" font-size="18" fill="#57606a" font-weight="400">The cursor is not a mouse pointer or a second database. A connection can create more than one cursor.</text></svg>