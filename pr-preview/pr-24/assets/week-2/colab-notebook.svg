<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="70" y="82" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#1f2937">Google Colab = Python in the Browser</text>
  <text x="70" y="122" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6b7280">A hosted Jupyter notebook: write, run, explain, and inspect.</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="90" y="185" width="690" height="360" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="90" y="185" width="690" height="56" rx="26" fill="#eef2ff"/>
    <circle cx="130" cy="213" r="8" fill="#94a3b8"/>
    <circle cx="158" cy="213" r="8" fill="#94a3b8"/>
    <circle cx="186" cy="213" r="8" fill="#94a3b8"/>
    <text x="435" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#3730a3">Colab Notebook</text>

    <rect x="130" y="275" width="610" height="72" rx="16" fill="#ffffff" stroke="#dbeafe"/>
    <text x="165" y="305" font-size="18" font-weight="700" fill="#1d4ed8">Markdown cell</text>
    <text x="165" y="330" font-size="17" fill="#475569">Explain the question and result</text>

    <rect x="130" y="365" width="610" height="72" rx="16" fill="#ffffff" stroke="#dcfce7"/>
    <text x="165" y="395" font-size="18" font-weight="700" fill="#15803d">Python code cell</text>
    <text x="165" y="420" font-size="17" fill="#475569">Run code interactively</text>

    <rect x="130" y="455" width="610" height="58" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="165" y="490" font-size="18" font-weight="700" fill="#475569">Output</text>
    <text x="255" y="490" font-size="17" fill="#475569">tables • charts • errors • results</text>

    <rect x="830" y="195" width="280" height="90" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="970" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">Browser-based</text>
    <text x="970" y="258" text-anchor="middle" font-size="18" fill="#475569">little local setup</text>

    <rect x="830" y="305" width="280" height="90" rx="20" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="970" y="340" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d">Student-friendly</text>
    <text x="970" y="368" text-anchor="middle" font-size="18" fill="#475569">common libraries ready</text>

    <rect x="830" y="415" width="280" height="90" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="970" y="450" text-anchor="middle" font-size="20" font-weight="700" fill="#c2410c">Hosted compute</text>
    <text x="970" y="478" text-anchor="middle" font-size="18" fill="#475569">CPU • GPU/TPU when available</text>
  </g>

  <rect x="200" y="565" width="800" height="82" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="600" y="599" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#9a3412">Runtime = temporary • Drive = persistent</text>
  <text x="600" y="627" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#9a3412">No paid Colab plan required for IA340 Week 2.</text>
</svg>
