<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="70" y="76" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#1f2937">Data storage landscape</text>
  <text x="70" y="116" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6b7280">Different systems are optimized for different jobs.</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <!-- Row 1 -->
    <g transform="translate(70 165)">
      <rect width="320" height="170" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="160" y="47" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Local Files</text>
      <text x="160" y="86" text-anchor="middle" font-size="18" fill="#475569">one computer</text>
      <text x="160" y="116" text-anchor="middle" font-size="18" fill="#475569">quick / temporary work</text>
    </g>
    <g transform="translate(440 165)">
      <rect width="320" height="170" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="160" y="47" text-anchor="middle" font-size="25" font-weight="700" fill="#1d4ed8">Google Drive</text>
      <text x="160" y="86" text-anchor="middle" font-size="18" fill="#475569">cloud file storage</text>
      <text x="160" y="116" text-anchor="middle" font-size="18" fill="#475569">personal / student / small team</text>
    </g>
    <g transform="translate(810 165)">
      <rect width="320" height="170" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <text x="160" y="47" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">GitHub</text>
      <text x="160" y="86" text-anchor="middle" font-size="18" fill="#475569">code + notebooks + docs</text>
      <text x="160" y="116" text-anchor="middle" font-size="18" fill="#475569">versioned project record</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(70 385)">
      <rect width="320" height="190" rx="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
      <text x="160" y="47" text-anchor="middle" font-size="25" font-weight="700" fill="#047857">Data Lake</text>
      <text x="160" y="82" text-anchor="middle" font-size="17" fill="#475569">cloud object storage</text>
      <text x="160" y="112" text-anchor="middle" font-size="17" fill="#475569">large raw / mixed-format data</text>
      <text x="160" y="148" text-anchor="middle" font-size="16" fill="#64748b">flexible analytics pipelines</text>
    </g>
    <g transform="translate(440 385)">
      <rect width="320" height="190" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
      <text x="160" y="47" text-anchor="middle" font-size="25" font-weight="700" fill="#c2410c">Data Warehouse</text>
      <text x="160" y="82" text-anchor="middle" font-size="17" fill="#475569">curated structured data</text>
      <text x="160" y="112" text-anchor="middle" font-size="17" fill="#475569">analytics / BI / reporting</text>
      <text x="160" y="148" text-anchor="middle" font-size="16" fill="#64748b">optimized for analytical queries</text>
    </g>
    <g transform="translate(810 385)">
      <rect width="320" height="190" rx="24" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
      <text x="160" y="47" text-anchor="middle" font-size="25" font-weight="700" fill="#6d28d9">Database</text>
      <text x="160" y="82" text-anchor="middle" font-size="17" fill="#475569">managed queryable data</text>
      <text x="160" y="112" text-anchor="middle" font-size="17" fill="#475569">applications / transactions</text>
      <text x="160" y="148" text-anchor="middle" font-size="16" fill="#64748b">relational or NoSQL</text>
    </g>
  </g>

  <text x="600" y="628" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Match storage to the job — no single platform fits everything.</text>
</svg>
