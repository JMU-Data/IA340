<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">County-level Census tables with precise crow foot cardinalities</title><desc id="desc">name.fips is the parent primary key. income.fips and population.fips are foreign keys and part of their respective composite primary keys. Each child references exactly one parent; each parent can have zero or many children. Lines terminate at fips field rows. name has a course-specific unique constraint.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker></defs><rect width="1200" height="800" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="46" font-size="31" fill="#172b4d" font-weight="bold" text-anchor="start">Our Census model: two one-to-many relationships</text><text x="40" y="80" font-size="21" fill="#57606a" font-weight="normal" text-anchor="start">Read the exact field link and the symbols at BOTH ends.</text><rect x="410" y="126" width="380" height="196" rx="10" fill="white" stroke="#0969da"/><rect x="410" y="126" width="380" height="48" rx="10" fill="#edf6ff" stroke="#0969da"/><text x="428" y="158" font-size="27" fill="#0969da" font-weight="bold" text-anchor="start">name</text><line x1="410" y1="174" x2="790" y2="174" stroke="#ccd7e2" stroke-width="1"/><text x="422" y="203" font-size="16" fill="#16816a" font-weight="bold" text-anchor="start">PK</text><text x="505" y="203" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">fips</text><text x="778" y="203" font-size="17" fill="#57606a" font-weight="normal" text-anchor="end">character varying</text><line x1="410" y1="218" x2="790" y2="218" stroke="#ccd7e2" stroke-width="1"/><text x="422" y="247" font-size="16" fill="#16816a" font-weight="bold" text-anchor="start">UQ</text><text x="505" y="247" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">name</text><text x="778" y="247" font-size="17" fill="#57606a" font-weight="normal" text-anchor="end">character varying</text><text x="425" y="296" font-size="19" fill="#0969da" font-weight="bold" text-anchor="start">Primary key: fips</text><rect x="80" y="380" width="420" height="240" rx="10" fill="white" stroke="#0969da"/><rect x="80" y="380" width="420" height="48" rx="10" fill="#edf6ff" stroke="#0969da"/><text x="98" y="412" font-size="27" fill="#0969da" font-weight="bold" text-anchor="start">income</text><line x1="80" y1="428" x2="500" y2="428" stroke="#ccd7e2" stroke-width="1"/><text x="92" y="457" font-size="16" fill="#16816a" font-weight="bold" text-anchor="start">PK, FK</text><text x="175" y="457" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">fips</text><text x="488" y="457" font-size="17" fill="#57606a" font-weight="normal" text-anchor="end">character varying</text><line x1="80" y1="472" x2="500" y2="472" stroke="#ccd7e2" stroke-width="1"/><text x="92" y="501" font-size="16" fill="#16816a" font-weight="bold" text-anchor="start"></text><text x="175" y="501" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">income</text><text x="488" y="501" font-size="17" fill="#57606a" font-weight="normal" text-anchor="end">integer</text><line x1="80" y1="516" x2="500" y2="516" stroke="#ccd7e2" stroke-width="1"/><text x="92" y="545" font-size="16" fill="#16816a" font-weight="bold" text-anchor="start">PK</text><text x="175" y="545" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">year</text><text x="488" y="545" font-size="17" fill="#57606a" font-weight="normal" text-anchor="end">integer</text><text x="95" y="594" font-size="19" fill="#0969da" font-weight="bold" text-anchor="start">Primary key: (fips, year)</text><rect x="700" y="380" width="420" height="240" rx="10" fill="white" stroke="#0969da"/><rect x="700" y="380" width="420" height="48" rx="10" fill="#edf6ff" stroke="#0969da"/><text x="718" y="412" font-size="27" fill="#0969da" font-weight="bold" text-anchor="start">population</text><line x1="700" y1="428" x2="1120" y2="428" stroke="#ccd7e2" stroke-width="1"/><text x="712" y="457" font-size="16" fill="#16816a" font-weight="bold" text-anchor="start">PK, FK</text><text x="795" y="457" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">fips</text><text x="1108" y="457" font-size="17" fill="#57606a" font-weight="normal" text-anchor="end">character varying</text><line x1="700" y1="472" x2="1120" y2="472" stroke="#ccd7e2" stroke-width="1"/><text x="712" y="501" font-size="16" fill="#16816a" font-weight="bold" text-anchor="start"></text><text x="795" y="501" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">population</text><text x="1108" y="501" font-size="17" fill="#57606a" font-weight="normal" text-anchor="end">integer</text><line x1="700" y1="516" x2="1120" y2="516" stroke="#ccd7e2" stroke-width="1"/><text x="712" y="545" font-size="16" fill="#16816a" font-weight="bold" text-anchor="start">PK</text><text x="795" y="545" font-size="21" fill="#172b4d" font-weight="bold" text-anchor="start">year</text><text x="1108" y="545" font-size="17" fill="#57606a" font-weight="normal" text-anchor="end">integer</text><text x="715" y="594" font-size="19" fill="#0969da" font-weight="bold" text-anchor="start">Primary key: (fips, year)</text><path d="M410 196 H40 V450 H80" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M790 196 H1160 V450 H1120" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="388" y1="184" x2="388" y2="208" stroke="#16816a" stroke-width="3"/><line x1="374" y1="184" x2="374" y2="208" stroke="#16816a" stroke-width="3"/><line x1="812" y1="184" x2="812" y2="208" stroke="#16816a" stroke-width="3"/><line x1="826" y1="184" x2="826" y2="208" stroke="#16816a" stroke-width="3"/><path d="M80 438 L63 450 L80 462" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="450" r="6" fill="white" stroke="#16816a" stroke-width="3"/><path d="M1120 438 L1137 450 L1120 462" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1150" cy="450" r="6" fill="white" stroke="#16816a" stroke-width="3"/><text x="115" y="174" font-size="20" fill="#16816a" font-weight="bold" text-anchor="start">1 parent</text><text x="910" y="174" font-size="20" fill="#16816a" font-weight="bold" text-anchor="start">1 parent</text><text x="98" y="349" font-size="23" fill="#16816a" font-weight="bold" text-anchor="start">income.fips → name.fips</text><text x="723" y="349" font-size="23" fill="#16816a" font-weight="bold" text-anchor="start">population.fips → name.fips</text><text x="93" y="638" font-size="19" fill="#57606a" font-weight="normal" text-anchor="start">A locality may have 0..many income rows.</text><text x="707" y="638" font-size="19" fill="#57606a" font-weight="normal" text-anchor="start">A locality may have 0..many population rows.</text><text x="40" y="708" font-size="22" fill="#172b4d" font-weight="bold" text-anchor="start">Legend</text><line x1="161" y1="701" x2="272" y2="701" stroke="#16816a" stroke-width="3"/><line x1="183" y1="689" x2="183" y2="713" stroke="#16816a" stroke-width="3"/><line x1="194" y1="689" x2="194" y2="713" stroke="#16816a" stroke-width="3"/><text x="290" y="708" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">|| = exactly one</text><line x1="555" y1="701" x2="666" y2="701" stroke="#16816a" stroke-width="3"/><circle cx="626" cy="701" r="6" fill="white" stroke="#16816a" stroke-width="3"/><path d="M666 689L643 701L666 713" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="686" y="708" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">circle + crow’s foot = zero or many</text><text x="40" y="758" font-size="20" fill="#172b4d" font-weight="bold" text-anchor="start">Each child has one parent. Each observation table has ONE primary key made from fips and year.</text></g></svg>