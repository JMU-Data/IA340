</defs></svg><main><header><div class="eyebrow">IA340 · Learn by following the changes</div><h1>Same data. Two places to compute.</h1><p>Keep the data in the center. Compare Drive + Colab on the left with Database + Colab on the right.</p></header><nav class="toolbar" aria-label="Walkthrough controls"><button id="back" type="button">← Back</button><button id="next" class="primary" type="button">Next step →</button><button id="restart" type="button">Restart</button><span id="position" class="position"></span></nav><div class="progress" aria-hidden="true"><div id="fill"></div></div><span id="phase" class="tag"></span><h2 id="step-title"></h2><div id="scene"></div><section class="explain" id="explain" aria-live="polite" aria-atomic="true"></section><noscript><p>Drive stores files; Colab computes. PostgreSQL stores tables and can compute a query before returning results. Both can retain data after a notebook disconnects.</p></noscript><footer>Fictional data; no database connections. <a href="https://pandas.pydata.org/docs/user_guide/scale.html">Pandas scaling</a> · <a href="https://www.postgresql.org/docs/18/queries.html">PostgreSQL queries</a>.</footer></main><script>
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,small=false)=>`<svg class="icon ${small?'small':''}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
function table(title,headers,rows,opt={}){return `<div class="table-wrap"><table><caption>${esc(title)}</caption><thead><tr>${headers.map((h,i)=>`<th class="${(opt.key||[]).includes(i)?'key':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr class="${(opt.bad||[]).includes(i)?'reject':(opt.fresh||[]).includes(i)?'new':''}">${r.map((c,j)=>`<td class="${(opt.key||[]).includes(j)?'key':''} ${opt.classes?.[`${i},${j}`]||''}">${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td class="empty" colspan="${headers.length}">No rows yet</td></tr>`}</tbody></table></div>`}
const badge=(text,kind='')=>`<span class="badge ${kind}">${esc(text)}</span>`;
const panel=(title,body,kind='')=>`<article class="panel ${kind}"><h3>${title}</h3>${body}</article>`;
let step=0;
function head(phase,title,text){$('phase').textContent=phase;$('step-title').textContent=title;$('explain').innerHTML=text}
function setStep(n){step=Math.max(0,Math.min(TOTAL-1,n));render();document.body.dataset.step=step;document.body.dataset.total=TOTAL;$('position').textContent=`Step ${step+1} of ${TOTAL}`;$('back').disabled=step===0;$('next').disabled=step===TOTAL-1;$('fill').style.width=`${100*(step+1)/TOTAL}%`}
$('back').onclick=()=>setStep(step-1);$('next').onclick=()=>setStep(step+1);$('restart').onclick=()=>setStep(0);
function init(){const hash=location.hash.slice(1);setStep(Object.hasOwn(ANCHORS,hash)?ANCHORS[hash]:0)}

const TOTAL=6,ANCHORS={compare:0,compute:2,users:4};
const ROWS=[['00001',2023,1000],['00001',2024,1100],['00002',2023,800],['00002',2024,900]];
function render(){
 const texts=[
 ['One question','What is the total population for 2024?','Both routes use exactly the same four fictional records. The center is our shared <strong>example dataset</strong>, not a service automatically synchronizing Drive and PostgreSQL. The answer is <strong>1100 + 900 = 2000</strong>.'],
 ['Move data or send a question','What crosses the network?','On the left, our earlier workflow copies all four source rows from Drive into Colab. On the right, Colab sends a small query request to PostgreSQL. The stored records stay on the database server.'],
 ['Compute','Which computer filters and adds?','Left: <strong>Colab CPU and RAM</strong> process the DataFrame. Right: <strong>the database server CPU and memory</strong> process the query close to its stored records. The blue panel highlights the active computation.'],
 ['Return the result','Same answer, different data transfer','Both answers are <strong>2000</strong>. The full-file route transferred four records to Colab; the database query returns one result row. For a large dataset, a small filtered or aggregated result can reduce client memory and transfer. Asking for every row removes that advantage.'],
 ['Shared access','Several clients can use one database','Colab, a BI tool, and another analyst can query the same managed records concurrently. The database coordinates record-level reads and updates. <strong>Drive also supports sharing</strong>; the additional benefit is database querying, constraints, and transaction control—not merely sharing a file.'],
 ['Persistent storage','Close Colab: the stored data remain','The CSV in Drive and the tables on the database server both persist when a Colab runtime disconnects. What changes is where query computation runs. Separating client analysis from the data service does <strong>not</strong> mean a PostgreSQL instance has unlimited resources or independently scalable storage and compute.']
 ];head(...texts[step]);
 const result=table('Result in Colab',['year','total population'],[[2024,2000]]);
 const left=`<div class="figure">${icon('folder')}<strong>Drive file</strong></div><div class="arrow">${step===0?'↓':'4 rows ↓'}</div><div class="figure">${icon(step===2?'cpu':'laptop')}<strong>Colab / Pandas</strong></div>${step===1?badge('4 records copied to notebook RAM','pending'):''}${step===2?badge('Filter 2024 → add 1100 + 900','pending'):''}${step>=3&&step<5?result:''}${step===5?badge('Colab disconnected; Drive file remains','good'):''}`;
 const right=`<div class="figure">${icon('db')}<strong>PostgreSQL storage</strong></div><div class="figure">${icon(step===2?'cpu':'cloud',true)}<span>${step===2?'Query runs here':'Persistent database service'}</span></div><div class="arrow">${step<3?'↑ request from Colab':'↓ 1 result row'}</div><div class="figure">${icon('laptop')}<strong>Colab</strong></div>${step===2?badge('Database filters → adds','pending'):''}${step===3?result:''}${step===4?`<div class="rowicons">${icon('person',true)}${icon('laptop',true)}${icon('person',true)}</div>${badge('Concurrent clients → same records','good')}`:''}${step===5?badge('Colab disconnected; tables remain','good'):''}`;
 $('scene').innerHTML=`<div class="three">${panel('Drive + Colab',left,step===2?'active':'')}${panel('The data',table('Four fictional observations',['fips','year','population'],ROWS,{fresh:step===2?[1,3]:[]})+'<p class="center"><strong>Question: total for 2024?</strong></p><p class="caption">Pine County: 00001 · Lake County: 00002</p>','source')}${panel('Database + Colab',right,step===2?'active':'')}</div>`;
}

window.addEventListener('hashchange',init);
init();</script></body></html>
