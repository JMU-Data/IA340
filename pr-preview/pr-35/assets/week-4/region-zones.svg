<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0969da"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial, sans-serif"><rect x="90" y="65" width="1020" height="365" rx="22" fill="#f7fbff" stroke="#c4d9ec" stroke-width="2"/><text x="600" y="111" font-size="30" fill="#18354b" text-anchor="middle" font-weight="700">One region</text><rect x="145" y="148" width="340" height="230" rx="22" fill="white" stroke="#c4d9ec" stroke-width="2"/><text x="315" y="192" font-size="27" fill="#18354b" text-anchor="middle" font-weight="700">Zone A</text><use href="#i-building" x="185" y="207" width="105" height="105"/><use href="#i-db" x="323" y="207" width="105" height="105"/><text x="315" y="352" font-size="24" fill="#18354b" text-anchor="middle" font-weight="500">Primary</text><rect x="715" y="148" width="340" height="230" rx="22" fill="white" stroke="#c4d9ec" stroke-width="2"/><text x="885" y="192" font-size="27" fill="#18354b" text-anchor="middle" font-weight="700">Zone B</text><use href="#i-building" x="755" y="207" width="105" height="105"/><use href="#i-db" x="893" y="207" width="105" height="105"/><text x="885" y="352" font-size="24" fill="#18354b" text-anchor="middle" font-weight="500">Standby</text><path d="M500 263 L690 263" fill="none" stroke="#0969da" stroke-width="5"  marker-end="url(#arrow)"/><text x="598" y="230" font-size="23" fill="#18354b" text-anchor="middle" font-weight="500">Replicate</text><text x="600" y="483" font-size="26" fill="#18354b" text-anchor="middle" font-weight="500">Separate zones reduce shared failure risk.</text><text x="600" y="524" font-size="23" fill="#18354b" text-anchor="middle" font-weight="500">A standby must be configured; our classroom instance uses one zone.</text></g></svg>