<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="385" viewBox="0 0 1280 385" role="img" aria-labelledby="title desc"><title id="title">WHERE removes rows. HAVING removes groups.</title><desc id="desc">Read the query as a sequence of transformations; this is not the physical execution plan.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0969da"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1278" height="383" rx="12" fill="white" stroke="#d0d7de"/><text x="28" y="43" font-size="30" fill="#1f2328" font-weight="700">WHERE removes rows. HAVING removes groups.</text><text x="28" y="78" font-size="18" fill="#57606a" font-weight="400">Read the query as a sequence of transformations; this is not the physical execution plan.</text><rect x="26" y="145" width="285" height="112" rx="10" fill="#fff8c5" stroke="#bf8700"/><text x="44" y="184" font-size="26" fill="#1f2328" font-weight="700">WHERE</text><text x="44" y="226" font-size="21" fill="#1f2328" font-weight="400">Choose release years</text><rect x="344" y="145" width="427" height="112" rx="10" fill="#ddf4ff" stroke="#0969da"/><text x="362" y="184" font-size="26" fill="#1f2328" font-weight="700">GROUP BY + AVG</text><text x="362" y="226" font-size="21" fill="#1f2328" font-weight="400">Summarize each FIPS</text><rect x="821" y="145" width="429" height="112" rx="10" fill="#fff8c5" stroke="#bf8700"/><text x="839" y="184" font-size="26" fill="#1f2328" font-weight="700">HAVING</text><text x="839" y="226" font-size="21" fill="#1f2328" font-weight="400">Keep means &gt; 100,000</text><path d="M314 200 L335 200" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><path d="M777 200 L812 200" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><text x="28" y="309" font-size="22" fill="#1f2328" font-weight="700">WHERE population &gt; 100000 is not the same as HAVING AVG(population) &gt; 100000.</text><text x="28" y="351" font-size="18" fill="#57606a" font-weight="400">The first changes the observations in the mean. The second tests the mean after it has been calculated.</text></svg>