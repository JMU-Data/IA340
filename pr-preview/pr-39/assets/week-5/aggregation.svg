<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="title desc"><title id="title">Filter rows, then calculate a summary</title><desc id="desc">The rows you include determine what your aggregate means.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0969da"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1198" height="563" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="35" y="48" font-size="31" fill="#1f2328" font-weight="700">Filter rows, then calculate a summary</text><text x="35" y="83" font-size="19" fill="#57606a" font-weight="400">The rows you include determine what your aggregate means.</text><rect x="35" y="135" width="315" height="265" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="52" y="176" font-size="22" fill="#0969da" font-weight="700">Input rows (simulation)</text><text x="54" y="219" font-size="22" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">fips      population</text><text x="54" y="258" font-size="22" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">51660       50000</text><text x="54" y="297" font-size="22" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">51165       90000</text><text x="54" y="336" font-size="22" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">51059     1200000</text><path d="M360 260 L463 260" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/><rect x="475" y="135" width="280" height="265" rx="12" fill="#fff8c5" stroke="#d0d7de"/><text x="495" y="176" font-size="26" fill="#1f2328" font-weight="700">WHERE</text><text x="495" y="229" font-size="20" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">population &gt;= 90000</text><text x="495" y="292" font-size="23" fill="#1f2328" font-weight="700">Keeps 2 rows</text><text x="495" y="351" font-size="22" fill="#57606a" font-weight="400">Filter first</text><path d="M765 260 L850 260" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/><rect x="861" y="135" width="305" height="265" rx="12" fill="#dafbe1" stroke="#d0d7de"/><text x="881" y="176" font-size="25" fill="#1a7f37" font-weight="700">SUM(population)</text><text x="881" y="252" font-size="23" fill="#1f2328" font-weight="400">90000 + 1200000</text><text x="881" y="309" font-size="29" fill="#1f2328" font-weight="700">= 1290000</text><text x="881" y="361" font-size="22" fill="#57606a" font-weight="400">One summary row</text><text x="35" y="468" font-size="24" fill="#1f2328" font-weight="700">COUNT: how many?   SUM: total   AVG: mean   MIN / MAX: extremes</text><text x="35" y="517" font-size="21" fill="#57606a" font-weight="400">Without GROUP BY: summarize the filtered set. With GROUP BY: summarize each group.</text></svg>