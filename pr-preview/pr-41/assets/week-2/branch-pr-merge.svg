<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="55" y="70" font-size="36" font-weight="700" fill="#1f2937">Branch → Pull Request → Review → Merge</text>
    <text x="55" y="108" font-size="20" fill="#6b7280">Prepare a change away from main, inspect it, then accept the reviewed version.</text>

    <g transform="translate(45 205)">
      <rect width="200" height="245" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="100" cy="55" r="32" fill="#dbeafe"/>
      <text x="100" y="66" text-anchor="middle" font-size="26" fill="#1d4ed8">1</text>
      <text x="100" y="125" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">BRANCH</text>
      <text x="100" y="170" text-anchor="middle" font-size="17" fill="#4b5563">Create</text>
      <text x="100" y="198" text-anchor="middle" font-size="17" fill="#4b5563">week2-readme</text>
    </g>

    <g transform="translate(275 205)">
      <rect width="200" height="245" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="100" cy="55" r="32" fill="#dbeafe"/>
      <text x="100" y="66" text-anchor="middle" font-size="26" fill="#1d4ed8">2</text>
      <text x="100" y="125" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">EDIT</text>
      <text x="100" y="170" text-anchor="middle" font-size="17" fill="#4b5563">Update README</text>
      <text x="100" y="198" text-anchor="middle" font-size="17" fill="#4b5563">and commit</text>
    </g>

    <g transform="translate(505 205)">
      <rect width="200" height="245" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="100" cy="55" r="32" fill="#dbeafe"/>
      <text x="100" y="66" text-anchor="middle" font-size="26" fill="#1d4ed8">3</text>
      <text x="100" y="125" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">OPEN PR</text>
      <text x="100" y="170" text-anchor="middle" font-size="17" fill="#4b5563">Propose the</text>
      <text x="100" y="198" text-anchor="middle" font-size="17" fill="#4b5563">change to main</text>
    </g>

    <g transform="translate(735 205)">
      <rect width="200" height="245" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="100" cy="55" r="32" fill="#dbeafe"/>
      <text x="100" y="66" text-anchor="middle" font-size="26" fill="#1d4ed8">4</text>
      <text x="100" y="125" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">REVIEW</text>
      <text x="100" y="170" text-anchor="middle" font-size="17" fill="#4b5563">Inspect</text>
      <text x="100" y="198" text-anchor="middle" font-size="17" fill="#4b5563">Files changed</text>
    </g>

    <g transform="translate(965 205)">
      <rect width="190" height="245" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="95" cy="55" r="32" fill="#dbeafe"/>
      <text x="95" y="66" text-anchor="middle" font-size="26" fill="#1d4ed8">5</text>
      <text x="95" y="125" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">MERGE</text>
      <text x="95" y="170" text-anchor="middle" font-size="17" fill="#4b5563">Accept into</text>
      <text x="95" y="198" text-anchor="middle" font-size="17" fill="#4b5563">main</text>
    </g>

    <g stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round">
      <line x1="249" y1="327" x2="268" y2="327"/>
      <line x1="479" y1="327" x2="498" y2="327"/>
      <line x1="709" y1="327" x2="728" y2="327"/>
      <line x1="939" y1="327" x2="958" y2="327"/>
    </g>
    <g fill="#2563eb">
      <path d="M268 327 l-11 -7 v14 z"/>
      <path d="M498 327 l-11 -7 v14 z"/>
      <path d="M728 327 l-11 -7 v14 z"/>
      <path d="M958 327 l-11 -7 v14 z"/>
    </g>

    <rect x="210" y="520" width="780" height="72" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="565" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">main stays stable until the reviewed change is merged.</text>
  </g>
</svg>
