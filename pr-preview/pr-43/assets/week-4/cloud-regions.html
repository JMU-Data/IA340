r(--greenbg);color:var(--green)}.badge.bad{background:var(--redbg);color:var(--red)}.badge.pending{background:var(--amberbg);color:var(--amber)}.explain{padding:15px 20px;border-left:5px solid var(--blue);background:#f0f7ff;margin-top:18px;min-height:90px}.table-wrap{overflow-x:auto;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:16px}caption{text-align:left;color:var(--ink);font-weight:700;padding-bottom:8px}th,td{padding:8px 10px;text-align:left;border:1px solid var(--line);white-space:nowrap}th{background:#eaf3ff}.key{background:#fff8c5}.new{background:#dafbe1}.reject,.wrong{background:#ffebe9}.empty{color:var(--muted)}.arrow{font-size:28px;text-align:center;color:var(--blue);margin:8px}.note{font-size:16px;padding:9px 12px;background:#fff8c5;border-radius:5px}.region{border:2px dashed #8c959f;border-radius:12px;padding:16px}.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}.zone{padding:12px;border:1px solid var(--line);border-radius:8px;background:#f6f8fa;min-height:170px;text-align:center}.zone.failed{background:#ffebe9;border-color:#a40e26}.zone small{display:block}.center{text-align:center}.bank{border-top:6px solid var(--blue)}.bank .big{font-variant-numeric:tabular-nums}.source{border:2px solid #0969da;background:#f0f7ff}.phasebar{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:12px;font-size:16px}.phasebar b{color:var(--blue)}footer{border-top:1px solid var(--line);margin-top:24px;padding-top:12px}a{color:var(--blue)}@media(max-width:780px){.figure{flex-wrap:wrap}.zone{min-width:0;overflow-wrap:anywhere}main{padding:14px}.three,.grid{grid-template-columns:1fr}.position{width:100%;margin:0}.zones{grid-template-columns:1fr 1fr}h2{font-size:22px}body{font-size:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg"><defs>

<symbol id="i-cloud" viewBox="0 0 100 80"><path d="M21 62C0 60 2 35 21 32C22 8 59 6 67 28C93 17 110 55 87 63Z" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/></symbol>
<symbol id="i-laptop" viewBox="0 0 90 80"><rect x="14" y="13" width="62" height="44" rx="4" fill="#1f2328"/><rect x="19" y="18" width="52" height="34" rx="1" fill="#ddf4ff"/><path d="M7 59h76l7 8H0Z" fill="#8c959f"/><rect x="35" y="61" width="20" height="3" fill="#57606a"/></symbol>
<symbol id="i-cpu" viewBox="0 0 80 80"><path d="M24 7v66M40 7v66M56 7v66M7 24h66M7 40h66M7 56h66" stroke="#57606a" stroke-width="5"/><rect x="16" y="16" width="48" height="48" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/><rect x="28" y="28" width="24" height="24" rx="3" fill="#0969da"/></symbol>

<symbol id="i-building" viewBox="0 0 80 80"><path d="M7 22L40 6l33 16v50H7Z" fill="#d8e8f4" stroke="#57606a" stroke-width="2"/><path d="M7 25h66M20 35h9m13 0h9m10 0h5M20 47h9m13 0h9m10 0h5M20 59h9m13 0h9m10 0h5" stroke="#0969da" stroke-width="6"/><path d="M33 72V59h14v13" fill="#57606a"/></symbol>
<symbol id="i-person" viewBox="0 0 80 80"><circle cx="40" cy="24" r="15" fill="#e8b58c"/><path d="M25 21C20 0 66 0 55 24l-7-10-19 5Z" fill="#1f2328"/><path d="M11 75V62c0-27 58-27 58 0v13" fill="#0969da"/><rect x="19" y="52" width="42" height="28" rx="3" fill="#afb8c1"/><circle cx="40" cy="65" r="3" fill="#fff"/></symbol>

</defs></svg><main><header><div class="eyebrow">IA340 · Learn by following the changes</div><h1>Region → zones → database placement</h1><p>One guided route. No location selectors: first one zone, then a conceptual two-zone deployment.</p></header><nav class="toolbar" aria-label="Walkthrough controls"><button id="back" type="button">← Back</button><button id="next" class="primary" type="button">Next step →</button><button id="restart" type="button">Restart</button><span id="position" class="position"></span></nav><div class="progress" aria-hidden="true"><div id="fill"></div></div><span id="phase" class="tag"></span><h2 id="step-title"></h2><div id="scene"></div><section class="explain" id="explain" aria-live="polite" aria-atomic="true"></section><noscript><p>A region contains zones. A configured HA deployment can fail over between zones; a single-zone classroom instance cannot. A backup is not a standby.</p></noscript><footer>Concept model, not a live failure test. <a href="https://docs.cloud.google.com/sql/docs/postgres/high-availability">Cloud SQL high availability</a> · <a href="https://docs.cloud.google.com/docs/geography-and-regions">Regions and zones</a>.</footer></main><script>
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,small=false)=>`<svg class="icon ${small?'small':''}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
function table(title,headers,rows,opt={}){return `<div class="table-wrap"><table><caption>${esc(title)}</caption><thead><tr>${headers.map((h,i)=>`<th class="${(opt.key||[]).includes(i)?'key':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr class="${(opt.bad||[]).includes(i)?'reject':(opt.fresh||[]).includes(i)?'new':''}">${r.map((c,j)=>`<td class="${(opt.key||[]).includes(j)?'key':''} ${opt.classes?.[`${i},${j}`]||''}">${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td class="empty" colspan="${headers.length}">No rows yet</td></tr>`}</tbody></table></div>`}
const badge=(text,kind='')=>`<span class="badge ${kind}">${esc(text)}</span>`;
const panel=(title,body,kind='')=>`<article class="panel ${kind}"><h3>${title}</h3>${body}</article>`;
let step=0;
function head(phase,title,text){$('phase').textContent=phase;$('step-title').textContent=title;$('explain').innerHTML=text}
function setStep(n){step=Math.max(0,Math.min(TOTAL-1,n));render();document.body.dataset.step=step;document.body.dataset.total=TOTAL;$('position').textContent=`Step ${step+1} of ${TOTAL}`;$('back').disabled=step===0;$('next').disabled=step===TOTAL-1;$('fill').style.width=`${100*(step+1)/TOTAL}%`}
$('back').onclick=()=>setStep(step-1);$('next').onclick=()=>setStep(step+1);$('restart').onclick=()=>setStep(0);
function init(){const hash=location.hash.slice(1);setStep(Object.hasOwn(ANCHORS,hash)?ANCHORS[hash]:0)}

const TOTAL=7,ANCHORS={region:0,zones:1,ha:3,failover:4};
function render(){
 const texts=[
 ['Region','Choose the geographic region','A provider operates regions in different geographic areas. Here we choose us-central1 (Iowa). Geography affects latency, available services, and cost. Follow the diagram without selecting a user location.'],
 ['Zone / AZ','A region contains multiple zones','<strong>Zone and availability zone (AZ) mean the same level here.</strong> There is not another AZ inside a zone. Data-center buildings, servers, power and networks provide the physical infrastructure; do not assume one zone equals one building.'],
 ['Our class','Put the database in one zone','The classroom uses one small PostgreSQL instance in a single zone. Other zones exist, but they do not automatically contain a copy of our database. No high-availability failover is configured for this class.'],
 ['Concept only','Place a primary and standby in different zones','For a suitably supported production configuration, regional HA uses a primary and a standby in different zones of the same region. Replication maintains the required copy. This is a different deployment from our classroom micro instance—not a free feature activated by this diagram.'],
 ['Failure','The primary zone becomes unavailable','Clients temporarily lose the database connection. In the conceptual HA configuration, the other zone still has the standby. In the classroom single-zone configuration, there is no standby ready to take over.'],
 ['Failover','The standby takes over; clients reconnect','The configured HA service promotes the standby and clients reconnect after an interruption. <strong>Recovery is not instantaneous.</strong> A failure affecting the entire region still needs separately planned cross-region recovery.'],
 ['Backup','A standby is not a historical backup','A replicated standby follows current changes—including an accidental deletion. A backup preserves a recoverable earlier state. Neither additional zones nor an unused region automatically create a backup. Our classroom has manual backup mode, no scheduled backup or point-in-time recovery.']
 ];head(...texts[step]);
 const ha=step>=3,fail=step>=4;
 const zone=(name,role,failed=false)=>`<div class="zone ${failed?'failed':''}"><strong>${name}</strong><div class="figure">${icon('building',true)}${role==='No database here'?'':icon('db',true)}</div><p>${failed?'✕ Zone unavailable':role}</p><small>Separate failure domain</small></div>`;
 const regions=step===0?`<div class="grid">${panel('Selected region','<div class="figure">'+icon('cloud')+icon('building')+'</div><p class="center">us-central1 · Iowa</p>','active')}${panel('Another region','<div class="figure">'+icon('cloud')+icon('building')+'</div><p class="center">Different geographic area · no database deployed</p>','soft')}</div>`:`<div class="region"><h3>Selected region: us-central1</h3><div class="zones">${zone('Zone A',step===1?'No database here':ha?(step>=5?'Unavailable former primary':'Primary'):'Classroom instance',fail)}${zone('Zone B',ha?(step>=5?'New primary':'Standby'):'No database here')}</div>${ha?`<p class="arrow">${step===4?'Detect failure…':step>=5?'Service continues from Zone B':'Primary → replicated standby'}</p>`:''}</div>`;
 $('scene').innerHTML=`<div class="figure">${icon('laptop')}<span>Application client</span><span class="arrow">${step===4?'✕': '↔'}</span>${icon('cloud')}<span>Cloud provider</span></div>${regions}${step===6?'<div class="figure">'+icon('disk')+'<strong>Backup: an earlier recoverable state</strong></div>':''}`;
}

window.addEventListener('hashchange',init);
init();</script></body></html>
