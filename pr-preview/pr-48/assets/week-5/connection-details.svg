<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Connect Colab to your existing database</title><desc id="desc">Six connection settings; username and password are separate fields.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0969da"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1198" height="608" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="35" y="48" font-size="31" fill="#1f2328" font-weight="700">Connect Colab to your existing database</text><text x="35" y="83" font-size="19" fill="#57606a" font-weight="400">Six connection settings; username and password are separate fields.</text><rect x="35" y="125" width="365" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="53" y="157" font-size="23" fill="#0969da" font-weight="700">IP address / host</text><text x="53" y="200" font-size="20" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">DB_HOST</text><text x="53" y="238" font-size="18" fill="#57606a" font-weight="400">Your instance’s Public IPv4</text><rect x="427" y="125" width="365" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="445" y="157" font-size="23" fill="#0969da" font-weight="700">Port</text><text x="445" y="200" font-size="20" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">5432</text><text x="445" y="238" font-size="18" fill="#57606a" font-weight="400">Default PostgreSQL port</text><rect x="819" y="125" width="365" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="837" y="157" font-size="23" fill="#0969da" font-weight="700">Database name</text><text x="837" y="200" font-size="20" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">DB_NAME → postgres</text><text x="837" y="238" font-size="18" fill="#57606a" font-weight="400">The database, not the instance</text><rect x="35" y="305" width="365" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="53" y="337" font-size="23" fill="#0969da" font-weight="700">Username</text><text x="53" y="380" font-size="20" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">DB_USER → postgres</text><text x="53" y="418" font-size="18" fill="#57606a" font-weight="400">Your PostgreSQL user</text><rect x="427" y="305" width="365" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="445" y="337" font-size="23" fill="#0969da" font-weight="700">Password</text><text x="445" y="380" font-size="20" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">DB_PASSWORD</text><text x="445" y="418" font-size="18" fill="#57606a" font-weight="400">Read from Colab Secrets</text><rect x="819" y="305" width="365" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="837" y="337" font-size="23" fill="#0969da" font-weight="700">SSL</text><text x="837" y="380" font-size="20" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">sslmode=&quot;require&quot;</text><text x="837" y="418" font-size="18" fill="#57606a" font-weight="400">Encrypt the connection</text><text x="35" y="510" font-size="22" fill="#1f2328" font-weight="700">Colab: key icon → Add new secret → Name / Value → Notebook access ON</text><text x="35" y="548" font-size="19" fill="#57606a" font-weight="400">Store DB_HOST, DB_NAME, DB_USER, DB_PASSWORD, and CENSUS_API_KEY in Secrets.</text><text x="35" y="579" font-size="18" fill="#57606a" font-weight="400">The code reads Secrets; it never contains or prints your actual password or API key.</text></svg>