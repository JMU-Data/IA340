<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Rows, columns, primary and foreign keys</title><desc id="desc">A locality table with primary key fips connects to population.fips. One highlighted population row is a 2020 observation. Columns are named fields. The population key is the pair fips and year.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="46" font-size="32" fill="#172b4d" font-weight="bold" text-anchor="start">Tables organize records; keys connect them</text><text x="100" y="120" font-size="25" fill="#0969da" font-weight="bold" text-anchor="start">name — one row per locality</text><rect x="100" y="142" width="540" height="138" rx="0" fill="white" stroke="#ccd7e2"/><rect x="100" y="142" width="540" height="46" rx="0" fill="#edf6ff" stroke="#ccd7e2"/><text x="112" y="172" font-size="19" fill="#0969da" font-weight="bold" text-anchor="start">fips · PK</text><text x="282" y="172" font-size="19" fill="#0969da" font-weight="bold" text-anchor="start">name</text><rect x="100" y="188" width="170" height="46" rx="0" fill="#d7f2e6" stroke="#ccd7e2"/><text x="112" y="218" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">51165</text><text x="282" y="218" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">Rockingham County</text><line x1="100" y1="188" x2="640" y2="188" stroke="#ccd7e2" stroke-width="1"/><rect x="100" y="234" width="170" height="46" rx="0" fill="#d7f2e6" stroke="#ccd7e2"/><text x="112" y="264" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">51660</text><text x="282" y="264" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">Harrisonburg city</text><line x1="100" y1="234" x2="640" y2="234" stroke="#ccd7e2" stroke-width="1"/><text x="690" y="157" font-size="22" fill="#0969da" font-weight="bold" text-anchor="start">COLUMN = one attribute</text><text x="690" y="190" font-size="20" fill="#57606a" font-weight="normal" text-anchor="start">Same kind of value down the column</text><path d="M690 211H674V304H185V282" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/><text x="100" y="86" font-size="19" fill="#16816a" font-weight="bold" text-anchor="start">Primary key: unique row identity</text><text x="310" y="388" font-size="25" fill="#0969da" font-weight="bold" text-anchor="start">population — one row per locality and year</text><rect x="310" y="410" width="520" height="184" rx="0" fill="white" stroke="#ccd7e2"/><rect x="310" y="410" width="520" height="46" rx="0" fill="#edf6ff" stroke="#ccd7e2"/><text x="322" y="440" font-size="19" fill="#0969da" font-weight="bold" text-anchor="start">fips · FK + PK</text><text x="522" y="440" font-size="19" fill="#0969da" font-weight="bold" text-anchor="start">year · PK</text><text x="652" y="440" font-size="19" fill="#0969da" font-weight="bold" text-anchor="start">population</text><text x="322" y="486" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">51165</text><text x="522" y="486" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">2010</text><text x="652" y="486" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">76,314</text><line x1="310" y1="456" x2="830" y2="456" stroke="#ccd7e2" stroke-width="1"/><rect x="310" y="502" width="200" height="46" rx="0" fill="#d7f2e6" stroke="#ccd7e2"/><text x="322" y="532" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">51165</text><rect x="510" y="502" width="130" height="46" rx="0" fill="#d7f2e6" stroke="#ccd7e2"/><text x="522" y="532" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">2020</text><rect x="640" y="502" width="190" height="46" rx="0" fill="#d7f2e6" stroke="#ccd7e2"/><text x="652" y="532" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">83,757</text><line x1="310" y1="502" x2="830" y2="502" stroke="#ccd7e2" stroke-width="1"/><text x="322" y="578" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">51660</text><text x="522" y="578" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">2020</text><text x="652" y="578" font-size="20" fill="#172b4d" font-weight="normal" text-anchor="start">51,814</text><line x1="310" y1="548" x2="830" y2="548" stroke="#ccd7e2" stroke-width="1"/><text x="42" y="530" font-size="21" fill="#16816a" font-weight="bold" text-anchor="start">ROW = one</text><text x="42" y="559" font-size="21" fill="#16816a" font-weight="bold" text-anchor="start">observation</text><line x1="184" y1="533" x2="300" y2="533" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/><path d="M 100 211 H 75 V 480 H 310" stroke="#16816a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="322" font-size="23" fill="#16816a" font-weight="bold" text-anchor="start">FK references PK</text><text x="102" y="350" font-size="20" fill="#16816a" font-weight="normal" text-anchor="start">51165 → 51165</text><text x="870" y="467" font-size="21" fill="#0969da" font-weight="bold" text-anchor="start">ONE composite PK</text><text x="870" y="498" font-size="22" fill="#0969da" font-weight="bold" text-anchor="start">(fips, year)</text><text x="870" y="535" font-size="19" fill="#57606a" font-weight="normal" text-anchor="start">Each part may repeat.</text><text x="870" y="563" font-size="19" fill="#57606a" font-weight="normal" text-anchor="start">The pair must be unique.</text><text x="40" y="668" font-size="17" fill="#57606a" font-weight="normal" text-anchor="start">Source: U.S. Census Bureau, 2010 and 2020 population counts. Harrisonburg is a county-equivalent city.</text></g></svg>