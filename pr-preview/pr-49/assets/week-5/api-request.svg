<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc"><title id="title">A request specifies what, where, and when</title><desc id="desc">census sends the request. STATE = states.VA selects Virginia. The API returns the county data.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0969da"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1278" height="448" rx="12" fill="white" stroke="#d0d7de"/><text x="28" y="43" font-size="30" fill="#1f2328" font-weight="700">A request specifies what, where, and when</text><text x="28" y="78" font-size="18" fill="#57606a" font-weight="400">census sends the request. STATE = states.VA selects Virginia. The API returns the county data.</text><rect x="30" y="133" width="288" height="152" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="48" y="166" font-size="24" fill="#0969da" font-weight="700">Product</text><text x="48" y="212" font-size="21" fill="#1f2328" font-weight="700">c.acs1</text><text x="48" y="250" font-size="20" fill="#1f2328" font-weight="400">ACS 1-year</text><rect x="340" y="133" width="288" height="152" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="358" y="166" font-size="24" fill="#0969da" font-weight="700">Variables</text><text x="358" y="212" font-size="21" fill="#1f2328" font-weight="700">NAME + population</text><text x="358" y="250" font-size="20" fill="#1f2328" font-weight="400">+ household income</text><rect x="650" y="133" width="288" height="152" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="668" y="166" font-size="24" fill="#0969da" font-weight="700">Geography</text><text x="668" y="212" font-size="21" fill="#1f2328" font-weight="700">county:*</text><text x="668" y="250" font-size="20" fill="#1f2328" font-weight="400">in state:51</text><rect x="960" y="133" width="288" height="152" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="978" y="166" font-size="24" fill="#0969da" font-weight="700">Survey years</text><text x="978" y="212" font-size="21" fill="#1f2328" font-weight="700">2015–2024</text><text x="978" y="250" font-size="20" fill="#1f2328" font-weight="400">Inspect coverage</text><rect x="30" y="316" width="1218" height="88" rx="10" fill="#ddf4ff" stroke="#0969da"/><text x="51" y="350" font-size="24" fill="#1f2328" font-weight="700">Census API → a list of county records in Colab</text><text x="51" y="383" font-size="20" fill="#1f2328" font-weight="400">The key identifies the request. The state and year select the published annual county records.</text></svg>