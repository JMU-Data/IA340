rder-collapse:collapse;width:100%;font-size:17px;background:white}caption{text-align:left;font-weight:700;color:#0969da;padding:0 0 8px}th,td{text-align:left;padding:9px 10px;border:1px solid #d1dbe6;vertical-align:top}th{background:#edf6ff;font-size:15px}td:first-child{font-variant-numeric:tabular-nums}.key{font-weight:700;color:#095db2}.repeat{background:#fff2c2}.new{background:#e2f6ed}.reject{background:#ffe9e5}.explain{background:#edf6ff;border-left:5px solid #0969da;padding:16px 20px;margin-top:18px;min-height:88px}.explain p{margin:0}.badge{display:inline-block;border-radius:6px;background:#e2f6ed;color:#12664f;padding:4px 10px;font-weight:700;font-size:15px}.badge.bad{background:#ffe9e5;color:#b42318}.figure{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}.icon{width:82px;height:78px}.icon.small{width:48px;height:48px}.center{text-align:center}.total{font-size:26px;font-weight:700;text-align:center;margin:12px 0}.arrow{text-align:center;color:#0969da;font-size:24px;font-weight:700;margin:12px 0}.stat{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}.stat span{background:#e2f6ed;border-radius:7px;padding:8px 14px;font-weight:700}.scene-note{font-size:16px;color:#57606a}footer{font-size:13px;color:#57606a;margin-top:24px}footer a{color:#0969da}.cardinal{display:block;width:100%;height:80px}.muted{color:#57606a}.callout{background:#fff2c2;padding:12px 16px;border-radius:8px;margin:12px 0}.freeze{border:2px solid #0969da}noscript{padding:15px;background:#fff2c2}@media(max-width:780px){main{padding:15px}h1{font-size:27px}h2{font-size:23px}.grid,.three{grid-template-columns:1fr}.phasebar{grid-template-columns:repeat(2,1fr)}.phasebar>div{font-size:16px}table{font-size:15px}th,td{padding:7px}.position{margin-left:0}.table-wrap{overflow:auto}.table-wrap table{min-width:360px}}</style></head><body><svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>

</defs></svg><main><header><div class="eyebrow">IA340 · Concepts in action</div><h1>Relationships: read both directions</h1><p>One-to-one · one-to-many · many-to-many. Follow the identifiers, then see which candidate records are accepted or rejected.</p></header><div id="labels"></div><nav class="toolbar" aria-label="Walkthrough controls"><button id="back" type="button">← Back</button><button id="next" class="primary" type="button">Next step →</button><button id="restart" type="button">Restart</button><span id="position" class="position"></span></nav><div class="progress" aria-hidden="true"><div id="fill"></div></div><span class="tag" id="phase"></span><h2 id="step-title"></h2><div id="scene"></div><section class="explain" id="explain" aria-live="polite" aria-atomic="true"></section><noscript>1:1 uses a unique foreign key. 1:N allows repeated foreign keys. M:N uses a junction table with two foreign keys.</noscript><footer>Student records are fictional. Population counts: <a href="https://www.census.gov/quickfacts/rockinghamcountyvirginia">Census 2010/2020</a>. <a href="https://www.postgresql.org/docs/18/ddl-constraints.html">PostgreSQL keys and constraints</a>.</footer></main><script>const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,small=false)=>`<svg class="icon ${small?'small':''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
function table(title,headers,rows,opt={}){return `<div class="table-wrap"><table><caption>${esc(title)}</caption><thead><tr>${headers.map((h,j)=>`<th class="${(opt.keys||[]).includes(j)?'key':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${(opt.reject||[]).includes(i)?'reject':''}">${r.map((c,j)=>`<td class="${(opt.keys||[]).includes(j)?'key':''} ${opt.cells?.[i+','+j]||''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const panel=(title,body,cls='')=>`<article class="panel ${cls}"><h3>${title}</h3>${body}</article>`;
const badge=(label,cls='')=>`<span class="badge ${cls}">${esc(label)}</span>`;
let step=0;function setStep(n){step=Math.max(0,Math.min(TOTAL-1,n));render();document.body.dataset.step=step;document.body.dataset.total=TOTAL;$('position').textContent=`Step ${step+1} of ${TOTAL}`;$('back').disabled=step===0;$('next').disabled=step===TOTAL-1;$('fill').style.width=(100*(step+1)/TOTAL)+'%'}
$('back').onclick=()=>setStep(step-1);$('next').onclick=()=>setStep(step+1);$('restart').onclick=()=>setStep(0);
function init(){setStep(ANCHORS[location.hash.slice(1)]??0)}


const TOTAL=9,ANCHORS={'one-to-one':0,'one-to-many':3,'many-to-many':6};
function connector(kind){let l='<path d="M100 40H1060" stroke="#16816a" stroke-width="3"/>';for(let x of [120,132])l+=`<path d="M${x} 25V55" stroke="#16816a" stroke-width="3"/>`;if(kind==='one')l+='<circle cx="1020" cy="40" r="7" fill="white" stroke="#16816a" stroke-width="3"/><path d="M1040 25V55" stroke="#16816a" stroke-width="3"/>';else l+='<circle cx="1010" cy="40" r="7" fill="white" stroke="#16816a" stroke-width="3"/><path d="M1060 22L1034 40L1060 58" fill="none" stroke="#16816a" stroke-width="3"/>';return '<svg class="cardinal" viewBox="0 0 1160 80" role="img" aria-label="One parent to '+(kind==='one'?'zero or one':'zero or many')+' children">'+l+'</svg>'}
function render(){let phase,title,ex,body;
 if(step<3){phase='One-to-one (1:1)';title=['One student, at most one university login','The foreign key selects an existing student','Unique prevents a second account for the same student'][step];body='<div class="grid">'+panel('Students',table('students',['student_id · PK','name'],[['S01','Alex'],['S02','Jordan']],{keys:[0]}))+panel('Login accounts',table('accounts',['account_id · PK','student_id · FK + UNIQUE'],[['U01','S01']],{keys:[0,1]}))+'</div>'+connector('one');
 if(step===2)body+=table('Rejected candidate — NOT stored',['account_id','student_id'],[['U02','S01']],{reject:[0]});
 ex=step===0?'This simplified model allows at most one account for each student. Every account must belong to exactly one existing student. A student may not have an account yet.':step===1?'The account’s student_id foreign key refers to students.student_id. It establishes WHO owns the account; the UNIQUE constraint supplies the at-most-one limit.':'U02 would create a second account for S01, so UNIQUE rejects it. A foreign key alone would allow several accounts for the same student.';}
 else if(step<6){phase='One-to-many (1:N)';title=['One locality can have several yearly observations','The same fips can repeat; the pair must be unique','A foreign key must find its parent'][step-3];body='<div class="grid">'+panel('One parent record',table('name',['fips · PK','name'],[['51165','Rockingham County']],{keys:[0]}))+panel('Two child records',table('population',['fips · FK + PK','year · PK','population'],[['51165',2010,76314],['51165',2020,83757]],{keys:[0,1]}))+'</div>'+connector('many');
 if(step===4)body+=table('Rejected duplicate key — NOT stored',['fips','year','population'],[['51165',2020,83757]],{reject:[0]});
 if(step===5)body+=table('Rejected missing-parent candidate — NOT stored',['fips','year','population'],[['99999',2020,100]],{reject:[0]});
 ex=step===3?'Each observation belongs to one locality, while one locality can have zero or many yearly observations. The parent is not required to have an observation yet.':step===4?'2010 and 2020 are different observations. fips alone is not unique in population. The composite key (fips, year) rejects a second copy of the SAME locality–year identity.':'No parent with identifier 99999 exists in the shown name table. The foreign key rejects that child row. The two valid observations remain unchanged.';}
 else{phase='Many-to-many (M:N)';title=['Students can take many courses; courses have many students','Enrollment turns M:N into two 1:N relationships','A student–course pair is stored once per modeled term'][step-6];body='<div class="three">'+panel('Students',table('students',['student_id · PK','name'],[['S01','Alex'],['S02','Jordan']],{keys:[0]}))+panel('Enrollment',table('enrollment',['student_id · PK,FK','course_id · PK,FK'],[['S01','IA340'],['S01','IA342'],['S02','IA340']],{keys:[0,1]}),'good')+panel('Courses',table('courses',['course_id · PK','title'],[['IA340','Data Mining'],['IA342','Visualization']],{keys:[0]}))+'</div><p class="arrow">Students 1 → N Enrollments N ← 1 Courses</p>';
 if(step===8)body+=table('Rejected duplicate enrollment — NOT stored',['student_id','course_id'],[['S01','IA340']],{reject:[0]});
 ex=step===6?'Alex has two courses. IA340 has two students. Three enrollment rows record three different links. The names and IDs are fictional; the example covers one fixed term.':step===7?'Enrollment has two foreign keys: student_id points to Students; course_id points to Courses. Together, the columns form ONE composite primary key.':'A second S01–IA340 row would repeat the same enrollment identity. The key rejects that extra copy; the valid three links remain. A multi-term design would also model the term.';}
 $('labels').innerHTML='<div class="phasebar" style="grid-template-columns:repeat(3,1fr)">'+['1:1 · One-to-one','1:N · One-to-many','M:N · Many-to-many'].map((s,i)=>`<div class="${Math.floor(step/3)===i?'current':''}">${s}</div>`).join('')+'</div>';$('phase').textContent=phase;$('step-title').textContent=title;$('scene').innerHTML=body;$('explain').innerHTML='<p>'+ex+'</p>';
}

window.addEventListener('hashchange',init);init();</script></body></html>
