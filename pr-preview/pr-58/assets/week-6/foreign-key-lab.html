<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A foreign key needs a parent</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1f2328;background:white}h2{font-size:22px;margin:0 0 10px}h3{font-size:17px;margin:8px 0}button{font:inherit;padding:7px 13px;margin:0 6px 8px 0;border:1px solid #8c959f;background:#f6f8fa;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #0969da}table{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}td,th{border:1px solid #d0d7de;padding:6px 9px;text-align:left}th{background:#f6f8fa}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.hit{background:#ddf4ff}.missing{background:#fff1e5}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;font:15px/1.4 ui-monospace,Consolas,monospace}.note{font-size:14px;color:#57606a}#status{padding:8px 12px;background:#ddf4ff;min-height:40px;border-radius:6px}tr{transition:background-color .25s}@media(max-width:650px){.grid,.three{grid-template-columns:1fr}body{font-size:16px;padding:8px}table{font-size:14px}}</style></head><body><h2>Can this population row be added?</h2><div class="grid"><div><h3>Existing name rows</h3><div id="parent"></div></div><div><h3>Proposed population row</h3><div id="child"></div></div></div><button id="run">Try INSERT</button><button id="reset">Reset</button><p id="status" aria-live="polite"></p><p class="note">Browser illustration of an enforced foreign key, not a live database write.</p><script>function table(h,rows){return '<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+(x===null?'NULL':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
document.getElementById('parent').innerHTML=table(['fips','name'],[['51059','Fairfax County'],['51660','Harrisonburg city']]);document.getElementById('child').innerHTML=table(['fips','year','population'],[['51998',2024,100000]]);
function reset(){document.getElementById('status').textContent='Look for 51998 in the parent table.';document.getElementById('run').disabled=false;}
document.getElementById('run').onclick=()=>{document.getElementById('status').textContent='Rejected: FIPS 51998 has no matching name row. Nothing is added.';document.getElementById('run').disabled=true;};document.getElementById('reset').onclick=reset;reset();function report(){if(parent!==window)parent.postMessage({type:'ia340-height',height:document.body.scrollHeight+8},'*');}addEventListener('load',report);new ResizeObserver(report).observe(document.body);</script></body></html>
