<symbol id="i-folder" viewBox="0 0 90 80"><path d="M6 18h30l9 10h38v44H6Z" fill="#d4a72c"/><path d="M6 31h80l-8 43H6Z" fill="#f2cc60" stroke="#9a6700" stroke-width="2"/></symbol>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0969da"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial, sans-serif"><rect x="405" y="30" width="390" height="190" rx="22" fill="#f3f8fd" stroke="#c4d9ec" stroke-width="2"/><use href="#i-building" x="425" y="52" width="140" height="135"/><text x="585" y="86" font-size="26" fill="#18354b" text-anchor="start" font-weight="700">Bank application</text><text x="585" y="126" font-size="21" fill="#18354b" text-anchor="start" font-weight="500">Validate requests</text><text x="585" y="160" font-size="21" fill="#18354b" text-anchor="start" font-weight="500">Read + write records</text><path d="M600 225 L600 280" fill="none" stroke="#0969da" stroke-width="5"  marker-end="url(#arrow)"/><use href="#i-db" x="510" y="277" width="180" height="175"/><text x="600" y="480" font-size="28" fill="#18354b" text-anchor="middle" font-weight="700">Authoritative account records</text><use href="#i-person" x="48" y="267" width="120" height="120"/><use href="#i-laptop" x="187" y="267" width="100" height="100"/><text x="165" y="417" font-size="28" fill="#18354b" text-anchor="middle" font-weight="700">Customer app</text><text x="165" y="453" font-size="23" fill="#18354b" text-anchor="middle" font-weight="500">View own balance</text><path d="M230 268 L421 168" fill="none" stroke="#0969da" stroke-width="5"  marker-end="url(#arrow)"/><text x="165" y="206" font-size="22" fill="#18354b" text-anchor="start" font-weight="500">Request a transfer</text><path d="M510 377 L288 377" fill="none" stroke="#0969da" stroke-width="5"  marker-end="url(#arrow)"/><text x="380" y="421" font-size="21" fill="#18354b" text-anchor="middle" font-weight="500">Read result</text><use href="#i-person" x="923" y="268" width="120" height="120"/><use href="#i-laptop" x="1047" y="267" width="100" height="100"/><text x="1025" y="417" font-size="27" fill="#18354b" text-anchor="middle" font-weight="700">Other customers</text><text x="1025" y="453" font-size="22" fill="#18354b" text-anchor="middle" font-weight="500">Use the same service</text><path d="M976 261 L785 161" fill="none" stroke="#0969da" stroke-width="5"  marker-end="url(#arrow)"/><path d="M690 377 L912 377" fill="none" stroke="#0969da" stroke-width="5"  marker-end="url(#arrow)"/><text x="600" y="535" font-size="23" fill="#18354b" text-anchor="middle" font-weight="500">Customers request transactions; they do not directly edit the balance table.</text></g></svg>