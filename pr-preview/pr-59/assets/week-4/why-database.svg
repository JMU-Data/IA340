<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 560" role="img" aria-label="Bank application controls changes to shared account records"><title>Bank application controls changes to shared account records</title><defs>
