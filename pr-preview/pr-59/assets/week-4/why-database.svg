<symbol id="i-file" viewBox="0 0 80 80"><path d="M17 6h33l15 17v51H17Z" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/><path d="M50 6v18h15M26 34h28M26 44h28M26 54h28M26 64h19" fill="none" stroke="#9a6700" stroke-width="3"/></symbol>
<symbol id="i-building" viewBox="0 0 80 80"><path d="M7 22L40 6l33 16v50H7Z" fill="#d8e8f4" stroke="#57606a" stroke-width="2"/><path d="M7 25h66M20 35h9m13 0h9m10 0h5M20 47h9m13 0h9m10 0h5M20 59h9m13 0h9m10 0h5" stroke="#0969da" stroke-width="6"/><path d="M33 72V59h14v13" fill="#57606a"/></symbol>
