<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc"><title id="title">INSERT needs two actions in this Colab example</title><desc id="desc">Autocommit is off: execute performs the change; commit finalizes the transaction.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0969da"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1278" height="468" rx="12" fill="white" stroke="#d0d7de"/><text x="28" y="43" font-size="30" fill="#1f2328" font-weight="700">INSERT needs two actions in this Colab example</text><text x="28" y="78" font-size="18" fill="#57606a" font-weight="400">Autocommit is off: execute performs the change; commit finalizes the transaction.</text><rect x="30" y="121" width="541" height="231" rx="10" fill="#f0f7ff" stroke="#0969da"/><text x="51" y="160" font-size="29" fill="#0969da" font-weight="700">1   cur.execute(sql)</text><text x="51" y="205" font-size="24" fill="#1f2328" font-weight="700">PostgreSQL runs the INSERT.</text><text x="51" y="244" font-size="21" fill="#1f2328" font-weight="400">The row exists in the current transaction.</text><text x="51" y="280" font-size="21" fill="#1f2328" font-weight="400">This connection can see its pending change.</text><text x="51" y="320" font-size="21" fill="#1f2328" font-weight="400">A new Studio query cannot see it yet.</text><path d="M585 230 L660 230" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><rect x="677" y="121" width="571" height="231" rx="10" fill="#dafbe1" stroke="#1a7f37"/><text x="700" y="160" font-size="29" fill="#1a7f37" font-weight="700">2   conn.commit()</text><text x="700" y="205" font-size="24" fill="#1f2328" font-weight="700">PostgreSQL commits the transaction.</text><text x="700" y="244" font-size="21" fill="#1f2328" font-weight="400">The saved row remains after this session ends.</text><text x="700" y="280" font-size="21" fill="#1f2328" font-weight="400">A new Studio query can now see it.</text><text x="700" y="320" font-size="21" fill="#1f2328" font-weight="400">Commit does not check data completeness.</text><text x="30" y="403" font-size="22" fill="#1f2328" font-weight="700">Do not confuse execute with “prepare to send,” or commit with “send the SQL.”</text><text x="30" y="444" font-size="18" fill="#57606a" font-weight="400">After saving: cur.close() and conn.close() release this client connection; they do not delete the database.</text></svg>