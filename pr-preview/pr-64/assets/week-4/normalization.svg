<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Keep one fact in one place</title><desc id="desc">Repeated descriptive facts may disagree. One county-name record connects to observations for different years. Repeated identifiers as foreign keys are not wrong duplicates.</desc><rect width="1200" height="460" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><g transform="translate(71 113) scale(1.1)"><path d="M0 0h63l27 27v91H0Z" fill="white" stroke="#0969da" stroke-width="3"/><path d="M63 0v27h27" fill="#dceffa" stroke="#0969da" stroke-width="3"/><text x="45" y="67" font-size="26" fill="#0969da" font-weight="600" text-anchor="middle">A</text></g><g transform="translate(234 91) scale(1.1)"><path d="M0 0h63l27 27v91H0Z" fill="white" stroke="#c84b49" stroke-width="3"/><path d="M63 0v27h27" fill="#dceffa" stroke="#c84b49" stroke-width="3"/><text x="45" y="67" font-size="26" fill="#c84b49" font-weight="600" text-anchor="middle">A?</text></g><g transform="translate(396 123) scale(1.1)"><path d="M0 0h63l27 27v91H0Z" fill="white" stroke="#0969da" stroke-width="3"/><path d="M63 0v27h27" fill="#dceffa" stroke="#0969da" stroke-width="3"/><text x="45" y="67" font-size="26" fill="#0969da" font-weight="600" text-anchor="middle">A</text></g><text x="284" y="398" font-size="23" fill="#17324d" font-weight="600" text-anchor="middle">Repeated name, conflicting copies</text><path d="M568 234L671 234" fill="none" stroke="#0969da" stroke-width="4" stroke-linecap="round"/><path d="M659.6 240.2L671 234L659.6 227.8" fill="none" stroke="#0969da" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(825 101) scale(0.83)"><path d="M0 25V8Q0 0 9 0h61l18 21h107q10 0 10 10v124H0Z" fill="#d89125"/><path d="M0 42h206l-16 126H-12Z" fill="#eeab40" stroke="#d38e2b" stroke-width="2"/></g><text x="910" y="176" font-size="32" fill="#17324d" font-weight="600" te