<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">FIPS identifies the place; name labels it</title><desc id="desc">Keep the existing name table. No state table or state-name column is added.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0969da"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1198" height="588" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="35" y="48" font-size="31" fill="#1f2328" font-weight="700">FIPS identifies the place; name labels it</text><text x="35" y="83" font-size="19" fill="#57606a" font-weight="400">Keep the existing name table. No state table or state-name column is added.</text><rect x="45" y="135" width="290" height="135" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="66" y="174" font-size="22" fill="#0969da" font-weight="700">State code</text><text x="66" y="231" font-size="36" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">&quot;51&quot;</text><text x="365" y="218" font-size="40" fill="#0969da" font-weight="700">+</text><rect x="430" y="135" width="290" height="135" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="449" y="174" font-size="22" fill="#0969da" font-weight="700">County code</text><text x="449" y="231" font-size="36" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">&quot;660&quot;</text><text x="750" y="218" font-size="40" fill="#0969da" font-weight="700">=</text><rect x="815" y="135" width="330" height="135" rx="12" fill="#dafbe1" stroke="#d0d7de"/><text x="836" y="174" font-size="22" fill="#1a7f37" font-weight="700">Full county FIPS</text><text x="836" y="231" font-size="36" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">&quot;51660&quot;</text><rect x="45" y="320" width="1100" height="175" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="65" y="360" font-size="23" fill="#0969da" font-weight="700">public.name</text><text x="70" y="405" font-size="22" fill="#1f2328" font-weight="700">fips (PK)</text><text x="350" y="405" font-size="22" fill="#1f2328" font-weight="700">name (required, not unique)</text><text x="70" y="453" font-size="23" fill="#1f2328" font-weight="400" font-family="Consolas,monospace">51660</text><text x="350" y="453" font-size="23" fill="#1f2328" font-weight="400">Harrisonburg city</text><text x="45" y="545" font-size="21" fill="#57606a" font-weight="400">Keep leading zeros and the geographic suffix. Do not store the trailing &quot;, Virginia&quot;.</text></svg>