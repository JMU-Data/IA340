<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INNER and LEFT JOIN</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1f2328;background:white}h2{font-size:22px;margin:0 0 10px}h3{font-size:17px;margin:8px 0}button{font:inherit;padding:7px 13px;margin:0 6px 8px 0;border:1px solid #8c959f;background:#f6f8fa;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #0969da}table{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}td,th{border:1px solid #d0d7de;padding:6px 9px;text-align:left}th{background:#f6f8fa}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.hit{background:#ddf4ff}.missing{background:#fff1e5}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;font:15px/1.4 ui-monospace,Consolas,monospace}.note{font-size:14px;color:#57606a}#status{padding:8px 12px;background:#ddf4ff;min-height:40px;border-radius:6px}tr{transition:background-color .25s}@media(max-width:650px){.grid,.three{grid-template-columns:1fr}body{font-size:16px;padding:8px}table{font-size:14px}}</style></head><body><h2 id="title"></h2><div class="grid"><div><h3>name AS n</h3><div id="left"></div></div><div><h3>population AS p · 2024</h3><div id="right"></div></div></div><button id="next">Match next name</button><button id="reset">Reset</button><p id="status" aria-live="polite"></p><div id="result"></div><p class="note">Selected real rows. Harrisonburg has a name but no 2024 observation in this extract.</p><script>function table(h,rows){return '<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+(x===null?'NULL':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
const mode=window.DEMO_MODE||location.hash.slice(1)||'inner', n=[['51059','Fairfax County'],['51107','Loudoun County'],['51660','Harrisonburg city']],p=[['51059',1160925],['51107',443380]];let at=0,out=[];
function draw(){document.getElementById('left').innerHTML='<table><tr><th>fips</th><th>name</th></tr>'+n.map((r,j)=>'<tr class="'+(j===at-1?'hit':'')+'"><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>';document.getElementById('right').innerHTML=table(['fips','population'],p);document.getElementById('result').innerHTML=table(['fips','name','population'],out);document.getElementById('next').disabled=at===n.length;}
function reset(){at=0;out=[];document.getElementById('title').textContent=mode==='left'?'LEFT JOIN keeps every name':'INNER JOIN keeps matching names';document.getElementById('status').textContent='Read ON n.fips = p.fips, then match one row.';draw();}
document.getElementById('next').onclick=()=>{let r=n[at],m=p.find(x=>x[0]===r[0]);if(m||mode==='left')out.push([...r,m?m[1]:null]);document.getElementById('status').textContent=m?r[1]+': matching FIPS found.':mode==='left'?'Harrisonburg: no match. Keep the name and show NULL.':'Harrisonburg: no match. Do not add a result row.';at++;draw();};document.getElementById('reset').onclick=reset;reset();function report(){if(parent!==window)parent.postMessage({type:'ia340-height',height:document.body.scrollHeight+8},'*');}addEventListener('load',report);new ResizeObserver(report).observe(document.body);</script></body></html>
