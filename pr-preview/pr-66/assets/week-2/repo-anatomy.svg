<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="55" y="70" font-size="36" font-weight="700" fill="#1f2937">A repository is files + project history</text>
    <text x="55" y="108" font-size="20" fill="#6b7280">GitHub preserves both the project and the process used to build it.</text>

    <rect x="70" y="175" width="480" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="110" y="225" font-size="27" font-weight="700" fill="#111827">Project files</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#334155">
      <text x="115" y="285">IA340/</text>
      <text x="145" y="330">README.md</text>
      <text x="145" y="375">week2_workspace.ipynb</text>
      <text x="145" y="420">mini-project/</text>
      <text x="145" y="465">final-project/</text>
    </g>

    <rect x="650" y="175" width="480" height="390" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="690" y="225" font-size="27" font-weight="700" fill="#1e3a8a">Project history</text>

    <g font-size="21" fill="#334155">
      <circle cx="705" cy="295" r="9" fill="#2563eb"/>
      <text x="735" y="302"><tspan font-weight="700">Commit</tspan><tspan> — a meaningful checkpoint</tspan></text>
      <circle cx="705" cy="365" r="9" fill="#2563eb"/>
      <text x="735" y="372"><tspan font-weight="700">Branch</tspan><tspan> — a safe place to change</tspan></text>
      <circle cx="705" cy="435" r="9" fill="#2563eb"/>
      <text x="735" y="442"><tspan font-weight="700">Pull request</tspan><tspan> — proposed change</tspan></text>
      <circle cx="705" cy="505" r="9" fill="#2563eb"/>
      <text x="735" y="512"><tspan font-weight="700">main</tspan><tspan> — accepted version</tspan></text>
    </g>
  </g>
</svg>
