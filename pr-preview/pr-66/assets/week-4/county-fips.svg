<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Four-character course fips identifier</title><desc id="desc">The IA340 ERD Lab model stores fips as character varying size 4. Treat it as text so leading zeros such as 0007 are preserved.</desc>
<rect width="1200" height="460" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="70" y="72" font-size="34" fill="#17324d" font-weight="700">Course fips field</text>
<text x="70" y="112" font-size="22" fill="#60778b">Use a four-character text identifier in this lab</text>
<rect x="90" y="160" width="430" height="190" rx="26" fill="#eef6ff" stroke="#0969da" stroke-width="3"/>
<text x="305" y="220" font-size="24" fill="#17324d" text-anchor="middle">ERD Lab setting</text>
<text x="305" y="280" font-size="52" fill="#0969da" font-weight="700" text-anchor="middle">VARCHAR · Size 4</text>
<text x="305" y="322" font-size="20" fill="#60778b" text-anchor="middle">store as text, not an integer</text>
<path d="M540 255 H650" stroke="#008b80" stroke-width="6" stroke-linecap="round"/>
<polygon points="650,255 626,242 626,268" fill="#008b80"/>
<rect x="690" y="160" width="420" height="190" rx="26" fill="#e8f8f3" stroke="#008b80" stroke-width="3"/>
<text x="900" y="220" font-size="24" fill="#17324d" text-anchor="middle">Example value</text>
<text x="900" y="288" font-size="68" fill="#008b80" font-weight="700" text-anchor="middle">0007</text>
<text x="900" y="326" font-size="20" fill="#60778b" text-anchor="middle">leading zeros are preserved</text>
<text x="600" y="408" font-size="22" fill="#17324d" text-anchor="middle">This slide documents the IA340 course schema; Week 5 will define how source data map into it.</text>
</g></svg>