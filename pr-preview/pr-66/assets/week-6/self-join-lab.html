<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One table: current and previous year</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1f2328;background:white}h2{font-size:22px;margin:0 0 10px}h3{font-size:17px;margin:8px 0}button{font:inherit;padding:7px 13px;margin:0 6px 8px 0;border:1px solid #8c959f;background:#f6f8fa;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #0969da}table{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}td,th{border:1px solid #d0d7de;padding:6px 9px;text-align:left}th{background:#f6f8fa}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.hit{background:#ddf4ff}.missing{background:#fff1e5}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;font:15px/1.4 ui-monospace,Consolas,monospace}.note{font-size:14px;color:#57606a}#status{padding:8px 12px;background:#ddf4ff;min-height:40px;border-radius:6px}tr{transition:background-color .25s}@media(max-width:650px){.grid,.three{grid-template-columns:1fr}body{font-size:16px;padding:8px}table{font-size:14px}}</style></head><body><h2>Match the same FIPS and exactly one calendar year</h2><div class="grid"><div><h3>population AS prev</h3><div id="prev"></div></div><div><h3>The same population AS curr</h3><div id="curr"></div></div></div><button id="next">Test next pair</button><button id="reset">Reset</button><p id="status" aria-live="polite"></p><div id="out"></div><p class="note">Fairfax rows from the supplied export. A self-join uses one stored table twice; it creates no new table.</p><script>function table(h,rows){return '<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+(x===null?'NULL':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
const rows=[[2018,1150795],[2019,1147532],[2021,1139720],[2022,1138331]];let at=-1,results=[];
function drawTable(target,sel){document.getElementById(target).innerHTML='<table><tr><th>fips</th><th>year</th><th>population</th></tr>'+rows.map((r,j)=>'<tr class="'+(j===sel?'hit':'')+'"><td>51059</td><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>';}
function reset(){at=-1;results=[];drawTable('prev',-1);drawTable('curr',-1);document.getElementById('out').innerHTML='';document.getElementById('status').textContent='The 2020 row is missing. Predict which pairs can be used.';document.getElementById('next').disabled=false;}
document.getElementById('next').onclick=()=>{at++;let a=rows[at],b=rows[at+1];drawTable('prev',at);drawTable('curr',at+1);const ok=b[0]===a[0]+1;document.getElementById('status').textContent=ok?a[0]+' → '+b[0]+': exactly one year. Keep this pair.':a[0]+' → '+b[0]+': TWO years. Reject this pair for an annual rate.';if(ok)results.push([b[0],a[1],b[1],(100*(b[1]-a[1])/a[1]).toFixed(3)]);document.getElementById('out').innerHTML=table(['year','previous_value','current_value','growth_rate_pct'],results);document.getElementById('next').disabled=at===rows.length-2;};document.getElementById('reset').onclick=reset;reset();function report(){if(parent!==window)parent.postMessage({type:'ia340-height',height:document.body.scrollHeight+8},'*');}addEventListener('load',report);new ResizeObserver(report).observe(document.body);</script></body></html>
