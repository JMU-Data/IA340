<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="490" viewBox="0 0 1280 490" role="img" aria-labelledby="title desc"><title id="title">Store the county once. Store each available year separately.</title><desc id="desc">All rows below are simplified teaching examples. Numeric estimates are invented.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0969da"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1278" height="488" rx="12" fill="white" stroke="#d0d7de"/><text x="28" y="43" font-size="30" fill="#1f2328" font-weight="700">Store the county once. Store each available year separately.</text><text x="28" y="78" font-size="18" fill="#57606a" font-weight="400">All rows below are simplified teaching examples. Numeric estimates are invented.</text><rect x="30" y="131" width="342" height="250" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="49" y="169" font-size="27" fill="#0969da" font-weight="700">name</text><text x="49" y="207" font-size="20" fill="#1f2328" font-weight="700">fips           name</text><text x="49" y="247" font-size="20" fill="#1f2328" font-weight="400">51059    Fairfax County</text><text x="49" y="294" font-size="22" fill="#1f2328" font-weight="700">One row per county</text><text x="49" y="332" font-size="20" fill="#1f2328" font-weight="400">No trailing state name</text><text x="49" y="362" font-size="19" fill="#1f2328" font-weight="400">FIPS stays text</text><path d="M385 216 L445 216" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><path d="M385 301 L445 301" fill="none" stroke="#0969da" stroke-width="2.6" marker-end="url(#arr)"/><rect x="467" y="131" width="376" height="250" rx="10" fill="#f0f7ff" stroke="#0969da"/><text x="486" y="169" font-size="27" fill="#0969da" font-weight="700">population</text><text x="486" y="207" font-size="19" fill="#1f2328" font-weight="700">fips       population       year</text><text x="486" y="247" font-size="20" fill="#1f2328" font-weight="400">51059       1100000    2015</text><text x="486" y="280" font-size="23" fill="#1f2328" font-weight="400">…</text><text x="486" y="316" font-size="20" fill="#1f2328" font-weight="400">51059       1200000    2024</text><text x="486" y="362" font-size="22" fill="#1f2328" font-weight="700">PK = (fips, year)</text><rect x="873" y="131" width="376" height="250" rx="10" fill="#f0f7ff" stroke="#0969da"/><text x="892" y="169" font-size="27" fill="#0969da" font-weight="700">income</text><text x="892" y="207" font-size="19" fill="#1f2328" font-weight="700">fips       income       year</text><text x="892" y="247" font-size="20" fill="#1f2328" font-weight="400">51059       100000      2015</text><text x="892" y="280" font-size="23" fill="#1f2328" font-weight="400">…</text><text x="892" y="316" font-size="20" fill="#1f2328" font-weight="400">51059       150000      2024</text><text x="892" y="362" font-size="22" fill="#1f2328" font-weight="700">PK = (fips, year)</text><text x="30" y="425" font-size="22" fill="#1f2328" font-weight="700">A repeated FIPS in different years is valid. A repeated (FIPS, year) is not a new observation.</text><text x="30" y="465" font-size="18" fill="#57606a" font-weight="400">Keep county identities even without annual observations. Missing observations do not create zero rows.</text></svg>