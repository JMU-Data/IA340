<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">SELECT chooses columns. WHERE chooses rows.</title><desc id="desc">Both change the returned result. Neither removes records from the source table.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker></defs>
<rect x="1" y="1" width="1198" height="638" rx="18" fill="white" stroke="#d0d7de"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2328}.mono{font-family:Consolas,monospace}</style>

<text x="40" y="85" font-size="32" style="fill:#1f2328" font-weight="700">SELECT chooses columns. WHERE chooses rows.</text>
<text x="40" y="118" font-size="18" style="fill:#57606a" font-weight="400">Both change the returned result. Neither removes records from the source table.</text>
<text x="40" y="179" font-size="24" style="fill:#0969da" font-weight="700">Source: public.population</text>
<rect x="40" y="198" width="460" height="230" rx="0" fill="white" stroke="#d0d7de"/>
<rect x="40" y="198" width="460" height="46" rx="0" fill="#ddf4ff" stroke="#d0d7de"/>
<text x="52" y="228" font-size="21" style="fill:#0969da" font-weight="700">fips</text>
<text x="52" y="274" font-size="20" style="fill:#1f2328" font-weight="400" class="mono">51660</text>
<text x="52" y="320" font-size="20" style="fill:#1f2328" font-weight="400" class="mono">51165</text>
<text x="52" y="366" font-size="20" style="fill:#1f2328" font-weight="400" class="mono">51059</text>
<text x="52" y="412" font-size="20" style="fill:#1f2328" font-weight="400" class="mono">51107</text>
<text x="192" y="228" font-size="21" style="fill:#0969da" font-weight="700">population</text>
<text x="192" y="274" font-size="20" style="fill:#1f2328" font-weight="400">50000</text>
<text x="192" y="320" font-size="20" style="fill:#1f2328" font-weight="400">90000</text>
<text x="192" y="366" font-size="20" style="fill:#1f2328" font-weight="400">1200000</text>
<text x="192" y="412" font-size="20" style="fill:#1f2328" font-weight="400">440000</text>
<text x="377" y="228" font-size="21" style="fill:#0969da" font-weight="700">year</text>
<text x="377" y="274" font-size="20" style="fill:#1f2328" font-weight="400">2024</text>
<text x="377" y="320" font-size="20" style="fill:#1f2328" font-weight="400">2024</text>
<text x="377" y="366" font-size="20" style="fill:#1f2328" font-weight="400">2024</text>
<text x="377" y="412" font-size="20" style="fill:#1f2328" font-weight="400">2024</text>
<line x1="40" y1="244" x2="500" y2="244" stroke="#d0d7de"/>
<line x1="40" y1="290" x2="500" y2="290" stroke="#d0d7de"/>
<line x1="40" y1="336" x2="500" y2="336" stroke="#d0d7de"/>
<line x1="40" y1="382" x2="500" y2="382" stroke="#d0d7de"/>
<rect x="540" y="199" width="619" height="119" rx="10" fill="#ddf4ff" stroke="#d0d7de"/>
<text x="560" y="235" font-size="24" style="fill:#1f2328" font-weight="500" class="mono">SELECT fips, population</text>
<text x="560" y="266" font-size="24" style="fill:#1f2328" font-weight="500" class="mono">FROM public.population</text>
<text x="560" y="297" font-size="24" style="fill:#1f2328" font-weight="500" class="mono">WHERE population &gt; 100000;</text>
<polyline points="1080,326 1080,365" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>
<text x="540" y="356" font-size="21" style="fill:#1a7f37" font-weight="700">Result: 2 rows × 2 columns</text>
<rect x="540" y="382" width="619" height="138" rx="0" fill="white" stroke="#d0d7de"/>
<rect x="540" y="382" width="619" height="46" rx="0" fill="#ddf4ff" stroke="#d0d7de"/>
<text x="552" y="412" font-size="21" style="fill:#0969da" font-weight="700">fips</text>
<text x="552" y="458" font-size="20" style="fill:#1f2328" font-weight="400" class="mono">51059</text>
<text x="552" y="504" font-size="20" style="fill:#1f2328" font-weight="400" class="mono">51107</text>
<text x="799" y="412" font-size="21" style="fill:#0969da" font-weight="700">population</text>
<text x="799" y="458" font-size="20" style="fill:#1f2328" font-weight="400">1200000</text>
<text x="799" y="504" font-size="20" style="fill:#1f2328" font-weight="400">440000</text>
<line x1="540" y1="428" x2="1159" y2="428" stroke="#d0d7de"/>
<line x1="540" y1="474" x2="1159" y2="474" stroke="#d0d7de"/>
<text x="40" y="612" font-size="16" style="fill:#57606a" font-weight="400">Numbers are simulated for teaching. Row order is unspecified without ORDER BY.</text>
</svg>