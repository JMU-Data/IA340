<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GROUP BY on real rows</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font:18px/1.45 Arial,sans-serif;color:#1f2328;background:#fff}h3{font-size:22px;margin:0 0 10px}p{margin:10px 0}table{border-collapse:collapse;width:100%;font-size:17px;margin:8px 0}th,td{border:1px solid #c9d1d9;padding:7px 9px;text-align:left}th{background:#f6f8fa}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.selected{background:#fff1cf}.new{background:#dafbe1;animation:arrive .35s ease}.note{font-size:14px;color:#57606a}.message{padding:10px;background:#ddf4ff;min-height:45px;border-radius:6px}button{font:inherit;padding:7px 12px;cursor:pointer;border:1px solid #8c959f;border-radius:6px;background:#f6f8fa;margin:3px 7px 6px 0}button:focus-visible{outline:3px solid #0969da}button:disabled{opacity:.5;cursor:default}pre{font:16px/1.45 monospace;padding:10px;background:#f6f8fa;white-space:pre-wrap}.arrow{text-align:center;font-size:30px;margin:8px}.hidden{visibility:hidden}@keyframes arrive{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.new{animation:none}}@media(max-width:650px){.cols{grid-template-columns:1fr}body{padding:8px;font-size:16px}table{font-size:14px}}</style></head><body><h3>Many rows → one total per year</h3><div class="cols"><div><b>Four selected source rows</b><table><thead><tr><th>year</th><th>name</th><th>population</th></tr></thead><tbody><tr><td>2023</td><td>Fairfax County</td><td>1,141,878</td></tr><tr><td>2023</td><td>Loudoun County</td><td>436,347</td></tr><tr><td>2024</td><td>Fairfax County</td><td>1,160,925</td></tr><tr><td>2024</td><td>Loudoun County</td><td>443,380</td></tr></tbody></table></div><div><b>GROUP BY year</b><div id="out"></div></div></div><button id="next">Group the next year</button><button id="reset">Reset</button><p class="note">Real Fairfax and Loudoun rows only. These two-county totals are not Virginia totals.</p><script>
const data=[{"year": 2023, "name": "Fairfax County", "population": 1141878}, {"year": 2023, "name": "Loudoun County", "population": 436347}, {"year": 2024, "name": "Fairfax County", "population": 1160925}, {"year": 2024, "name": "Loudoun County", "population": 443380}];let at=0;const years=[2023,2024];function draw(){document.getElementById('out').innerHTML='<table><tr><th>year</th><th>COUNT(*)</th><th>SUM(population)</th></tr>'+years.slice(0,at).map(y=>{let rs=data.filter(r=>r.year===y);return '<tr class="new"><td>'+y+'</td><td>'+rs.length+'</td><td>'+rs.reduce((a,r)=>a+r.population,0).toLocaleString('en-US')+'</td></tr>'}).join('')+'</table>';document.getElementById('next').disabled=at===2}document.getElementById('next').onclick=()=>{at++;draw()};document.getElementById('reset').onclick=()=>{at=0;draw()};draw();

function report(){if(parent!==window)parent.postMessage({type:'ia340-height',height:document.body.scrollHeight+20},'*')}new ResizeObserver(report).observe(document.body);addEventListener('load',report);</script></body></html>
