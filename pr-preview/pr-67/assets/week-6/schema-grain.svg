/text><text x="211" y="232" class="small" text-anchor="start">0..many</text><text x="846" y="232" class="small" text-anchor="start">0..many</text><text x="550" y="493" class="small" text-anchor="middle">Each observation belongs to exactly one name; a name may have no observations.</text></svg>